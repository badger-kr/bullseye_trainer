    function updateTargetPositUI() {
        if (isTargetCallPending) {
            const rowCount = currentGroups > 1 ? currentGroups : 1;
            const rows = Array.from({ length: rowCount }, () => ({
                position: '—',
                bullseye: '—',
                altitude: '—',
                track: '—'
            }));
            renderTargetTable('—', rows);
            return;
        }

        const hideAnswers = document.getElementById('voiceMode').checked && !isChecked;

        if (currentGroups > 1 && groupsData.length === 0) {
            const rows = Array.from({ length: currentGroups }, (_, index) => ({
                number: index + 1,
                position: `G${index + 1}`,
                bullseye: '—',
                altitude: '—',
                track: '—'
            }));
            renderTargetTable('PICTURE', rows);
            return;
        }

        if (currentGroups > 1) {
            const rows = groupsData.map((g, index) => ({
                number: index + 1,
                position: shortLabel(g.label),
                bullseye: hideAnswers ? '—' : `${g.brg.toString().padStart(3, '0')}° / ${g.rng} nm`,
                altitude: hideAnswers ? '—' : `${g.alt.toLocaleString('en-US')} ft`,
                track: hideAnswers || !problemAspectOn ? '—' : TRACK_ABBR[g.hdg]
            }));
            renderTargetTable(pictureShape.toUpperCase(), rows);
            return;
        }

        const hasTarget = tgtData.rng !== 0 || tgtData.brg !== 0;
        renderTargetTable('SINGLE', [{
            position: '—',
            bullseye: !hasTarget || hideAnswers ? '—' : `${tgtData.brg.toString().padStart(3, '0')}° / ${tgtData.rng} nm`,
            altitude: !hasTarget || hideAnswers ? '—' : `${tgtData.alt.toLocaleString('en-US')} ft`,
            track: !hasTarget || hideAnswers || !problemAspectOn ? '—' : TRACK_ABBR[tgtData.hdg]
        }]);
    }

    // 숫자→영단어 변환 (방위는 자리별, 0=zero / 9=niner)
    const DIGIT_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'niner'];
    const SMALL_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
        'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
    const TENS_WORDS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
    const TRACK_WORDS = { 0: 'north', 45: 'northeast', 90: 'east', 135: 'southeast', 180: 'south', 225: 'southwest', 270: 'west', 315: 'northwest' };
    const TRACK_ABBR = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };

    function bearingToWords(brg) {
        return brg.toString().padStart(3, '0').split('').map(d => DIGIT_WORDS[parseInt(d, 10)]).join(' ');
    }

    function numberToWords(n) {
        if (n < 20) return SMALL_WORDS[n];
        if (n < 100) {
            const rest = n % 10;
            return TENS_WORDS[Math.floor(n / 10)] + (rest ? ` ${SMALL_WORDS[rest]}` : '');
        }
        const rest = n % 100;
        return `${SMALL_WORDS[Math.floor(n / 100)]} hundred` + (rest ? ` ${numberToWords(rest)}` : '');
    }

    function altToWords(alt) {
        return `${numberToWords(alt / 1000)} thousand`;
    }

    function capitalize(s) {
        return s.charAt(0).toUpperCase() + s.slice(1);
    }

    // 화면 표기는 lead로 유지하고 TTS 문자열에서만 "리드" 발음을 유도
    function spokenGroupLabel(label) {
        return label.replace(/\blead\b/g, 'leed');
    }

    // 한 그룹의 Bullseye, altitude, track을 끊지 않고 이어서 재생
    function buildCallUtterances() {
        if (currentGroups === 1) {
            let text = `Bullseye ${bearingToWords(tgtData.brg)}, ${numberToWords(tgtData.rng)} miles, at ${altToWords(tgtData.alt)}`;
            if (problemAspectOn) text += `, track ${TRACK_WORDS[tgtData.hdg]}`;
            return [{ text: text + '.', pauseAfter: 0 }];
        }

        const utterances = [];
        let intro = `${currentGroups === 2 ? 'Two' : 'Three'} groups, ${pictureShape}`;
        if (pictureShape === 'azimuth') intro += ` ${numberToWords(azimuthSep)}`;
        utterances.push({ text: intro + '.', pauseAfter: 300 });

        groupsData.forEach((g, index) => {
            const isLast = index === groupsData.length - 1;
            let text = `${capitalize(spokenGroupLabel(g.label))}. Bullseye ${bearingToWords(g.brg)}, ${numberToWords(g.rng)}, at ${altToWords(g.alt)}`;
            if (problemAspectOn) text += `, track ${TRACK_WORDS[g.hdg]}`;
            utterances.push({ text: text + '.', pauseAfter: isLast ? 0 : 300 });
        });
        return utterances;
    }

    function speakUtterances(segments) {
        lastUtterances = segments.map(segment => ({ ...segment }));
        updateSayAgainState();
        if (document.getElementById('voiceMode').checked) {
            playUtterances(segments);
        }
    }

    function getVoiceRate() {
        const rate = parseFloat(document.getElementById('voiceRate').value);
        return Number.isFinite(rate) ? rate : 1.0;
    }

    function getSpeechSynthesisRate() {
        return getVoiceRate() * SPEECH_RATE_SCALE;
    }

    function playUtterances(segments) {
        try {
            if (!('speechSynthesis' in window)) return;
            const sequenceToken = ++speechSequenceToken;
            window.speechSynthesis.cancel();

            const playNext = index => {
                if (sequenceToken !== speechSequenceToken || index >= segments.length) return;
                const segment = typeof segments[index] === 'string'
                    ? { text: segments[index], pauseAfter: 0 }
                    : segments[index];
                const utterance = new SpeechSynthesisUtterance(segment.text);
                utterance.lang = 'en-US';
                utterance.rate = getSpeechSynthesisRate();
                if (myVoice) utterance.voice = myVoice;
                utterance.onend = () => {
                    const pause = Math.max(0, segment.pauseAfter || 0);
                    setTimeout(() => playNext(index + 1), pause);
                };
                utterance.onerror = () => playNext(index + 1);
                window.speechSynthesis.speak(utterance);
            };

            playNext(0);
        } catch (error) {
            console.error("Speech Synthesis Error:", error);
        }
    }

    function updateSayAgainState() {
        document.getElementById('btnSayAgain').disabled =
            isTargetCallPending || lastUtterances.length === 0 || !document.getElementById('voiceMode').checked;
    }

    function calculateTrueBearing() {
        const myRad = myData.brg * (Math.PI / 180);
        const myX = myData.rng * Math.sin(myRad);
        const myY = -myData.rng * Math.cos(myRad);

        const tgtRad = tgtData.brg * (Math.PI / 180);
        const tgtX = tgtData.rng * Math.sin(tgtRad);
        const tgtY = -tgtData.rng * Math.cos(tgtRad);

        const dx = tgtX - myX;
        const dy = tgtY - myY;

        let angleRad = Math.atan2(dx, -dy);
        let angleDeg = angleRad * (180 / Math.PI);

        if (angleDeg < 0) angleDeg += 360;
        trueBearing = Math.round(angleDeg);
        trueRange = Math.round(Math.hypot(dx, dy));
    }

    // bullseye 기준 nm 좌표 변환 (화면 좌표계: 북 = y 음수)
    function positToXY(brg, rng) {
        const rad = brg * (Math.PI / 180);
        return { x: rng * Math.sin(rad), y: -rng * Math.cos(rad) };
    }

    function xyToPosit(x, y) {
        let deg = Math.atan2(x, -y) * (180 / Math.PI);
        if (deg < 0) deg += 360;
        return { brg: Math.round(deg) % 360, rng: Math.round(Math.hypot(x, y)) };
    }

    function randomAlt() {
        return (Math.floor(Math.random() * 45) + 1) * 1000;
    }

    function getGroupsSetting() {
        return parseInt(document.querySelector('input[name="groups"]:checked').value, 10);
    }

    // aspect angle: 타겟 heading과 "타겟→내 기체" 방위 사이 각도 [0,180]
    function aspectAngle(grpXY, hdg) {
        const own = positToXY(myData.brg, myData.rng);
        const dx = own.x - grpXY.x;
        const dy = own.y - grpXY.y;
        let brg = Math.atan2(dx, -dy) * (180 / Math.PI);
        if (brg < 0) brg += 360;
        let diff = Math.abs(brg - hdg) % 360;
        return diff > 180 ? 360 - diff : diff;
    }

    function classifyAspect(aa) {
        if (aa < 45) return 'HOT';
        if (aa < 70) return 'FLANK';
        if (aa < 110) return 'BEAM';
        return 'COLD';
    }

    function isNearAspectBoundary(aa) {
        return [45, 70, 110].some(b => Math.abs(aa - b) <= 8);
    }

    // 8방위 heading 추첨. Aspect on이면 분류 경계 ±8° 회피, 소진 시 null(위치 재생성 필요)
    function pickHeading(grpXY) {
        const headings = [0, 45, 90, 135, 180, 225, 270, 315].sort(() => Math.random() - 0.5);
        for (let hdg of headings) {
            if (!problemAspectOn) return hdg;
            if (!isNearAspectBoundary(aspectAngle(grpXY, hdg))) return hdg;
        }
        return null;
    }

    // picture 형태 우선 생성: 형태 추첨 → 배치, 제약 위반 시 재시도
    function generatePicture(n) {
        for (let attempt = 0; attempt < 300; attempt++) {
            const shape = n === 2
                ? (Math.random() < 0.5 ? 'azimuth' : 'range')
                : ['wall', 'ladder', 'vic', 'champagne'][Math.floor(Math.random() * 4)];

            // 그룹 무리 중심: bullseye 60~120nm
            const c = positToXY(Math.random() * 360, 60 + Math.random() * 60);
            const own = positToXY(myData.brg, myData.rng);

            // 접근 축 = ownship → centroid 단위벡터
            let ax = c.x - own.x;
            let ay = c.y - own.y;
            const axisLen = Math.hypot(ax, ay);
            if (axisLen < 20) continue;
            ax /= axisLen;
            ay /= axisLen;

            // 분리축 스냅: 남북(0,1) vs 동서(1,0) 중 접근 축에 더 수직인 쪽 (동률이면 랜덤)
            let perp;
            if (Math.abs(ay) > Math.abs(ax)) perp = { x: 1, y: 0 };
            else if (Math.abs(ax) > Math.abs(ay)) perp = { x: 0, y: 1 };
            else perp = Math.random() < 0.5 ? { x: 1, y: 0 } : { x: 0, y: 1 };

            // perp 음수 방향이 북/서 → [앞 라벨, 뒤 라벨]
            const dirs = perp.y === 1 ? ['north', 'south'] : ['west', 'east'];
            const sep = () => 20 + Math.random() * 20;

            let pts = [];
            azimuthSep = 0;
            if (shape === 'azimuth') {
                const d = sep();
                azimuthSep = Math.round(d);
                pts = [
                    { x: c.x - perp.x * d / 2, y: c.y - perp.y * d / 2, label: `${dirs[0]} group` },
                    { x: c.x + perp.x * d / 2, y: c.y + perp.y * d / 2, label: `${dirs[1]} group` }
                ];
            } else if (shape === 'range') {
                const d = sep();
                pts = [
                    { x: c.x - ax * d / 2, y: c.y - ay * d / 2, label: 'lead group' },
                    { x: c.x + ax * d / 2, y: c.y + ay * d / 2, label: 'trail group' }
                ];
            } else if (shape === 'wall') {
                const d = sep();
                pts = [
                    { x: c.x - perp.x * d, y: c.y - perp.y * d, label: `${dirs[0]} group` },
                    { x: c.x, y: c.y, label: 'middle group' },
                    { x: c.x + perp.x * d, y: c.y + perp.y * d, label: `${dirs[1]} group` }
                ];
            } else if (shape === 'ladder') {
                const d = sep();
                pts = [
                    { x: c.x - ax * d, y: c.y - ay * d, label: 'lead group' },
                    { x: c.x, y: c.y, label: 'middle group' },
                    { x: c.x + ax * d, y: c.y + ay * d, label: 'trail group' }
                ];
            } else if (shape === 'vic') {
                const d1 = sep();
                const d2 = sep();
                pts = [
                    { x: c.x - ax * d1 / 2, y: c.y - ay * d1 / 2, label: 'lead group' },
                    { x: c.x + ax * d1 / 2 - perp.x * d2 / 2, y: c.y + ay * d1 / 2 - perp.y * d2 / 2, label: `${dirs[0]} trail group` },
                    { x: c.x + ax * d1 / 2 + perp.x * d2 / 2, y: c.y + ay * d1 / 2 + perp.y * d2 / 2, label: `${dirs[1]} trail group` }
                ];
            } else { // champagne
                const d1 = sep();
                const d2 = sep();
                pts = [
                    { x: c.x - ax * d1 / 2 - perp.x * d2 / 2, y: c.y - ay * d1 / 2 - perp.y * d2 / 2, label: `${dirs[0]} lead group` },
                    { x: c.x - ax * d1 / 2 + perp.x * d2 / 2, y: c.y - ay * d1 / 2 + perp.y * d2 / 2, label: `${dirs[1]} lead group` },
                    { x: c.x + ax * d1 / 2, y: c.y + ay * d1 / 2, label: 'trail group' }
                ];
            }

            // 모든 그룹은 30~150nm 링 안에 위치
            if (pts.some(p => {
                const r = Math.hypot(p.x, p.y);
                return r < MIN_RANGE || r > MAX_RANGE;
            })) continue;

            // heading 추첨 (경계 회피 실패 시 전체 재생성)
            const groups = [];
            let ok = true;
            for (let p of pts) {
                const hdg = pickHeading(p);
                if (hdg === null) { ok = false; break; }
                const posit = xyToPosit(p.x, p.y);
                groups.push({ label: p.label, x: p.x, y: p.y, brg: posit.brg, rng: posit.rng, alt: randomAlt(), hdg: hdg });
            }
            if (!ok) continue;

            pictureShape = shape;
            return groups;
        }
        return null;
    }

    // 그룹 라벨 축약 표기 (resultBox·aspect 행용)
    function shortLabel(label) {
        const map = { north: 'N', south: 'S', west: 'W', east: 'E', lead: 'LD', middle: 'MID', trail: 'TR' };
        return label.replace(' group', '').split(' ').map(w => map[w] || w).join('.');
    }

    // === 설정 저장/복원 (localStorage) ===
    const SETTINGS_KEY = 'bullseyeTrainerSettings';

    function saveSettings() {
        const settings = {
            easy: document.getElementById('easyMode').checked,
            voice: document.getElementById('voiceMode').checked,
            showBra: document.getElementById('showBraMode').checked,
            plot: document.getElementById('plotMode').checked,
            autoRefresh: document.getElementById('autoRefreshMode').checked,
            refreshInterval: document.getElementById('refreshInterval').value,
            voiceRate: document.getElementById('voiceRate').value,
            voiceRateVersion: 3,
            voiceGender: getVoiceGenderSetting(),
            voiceGenderVersion: 2,
            leadTimeEnabled: document.getElementById('leadTimeMode').checked,
            leadTimeSeconds: document.getElementById('leadTimeSeconds').value,
            fixOwn: document.getElementById('fixOwnBullseye').checked,
            answerRange: document.getElementById('answerRangeMode').checked,
            aspect: document.getElementById('aspectMode').checked,
            groups: getGroupsSetting(),
            dark: document.body.classList.contains('dark-mode')
        };
        try {
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        } catch (error) { /* localStorage 사용 불가 환경 무시 */ }
    }

    function loadSettings() {
        try {
            const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null');
            if (!saved) return;

            const setCheck = (id, val) => {
                if (typeof val === 'boolean') document.getElementById(id).checked = val;
            };
            setCheck('easyMode', saved.easy);
            setCheck('voiceMode', saved.voice);
            setCheck('showBraMode', saved.showBra);
            setCheck('plotMode', saved.plot);
            setCheck('autoRefreshMode', saved.autoRefresh);
            setCheck('leadTimeMode', saved.leadTimeEnabled);
            setCheck('fixOwnBullseye', saved.fixOwn);
            setCheck('answerRangeMode', saved.answerRange);
            setCheck('aspectMode', saved.aspect);
            if (saved.refreshInterval) document.getElementById('refreshInterval').value = saved.refreshInterval;
            if (saved.leadTimeSeconds && !isNaN(parseInt(saved.leadTimeSeconds, 10))) {
                document.getElementById('leadTimeSeconds').value = saved.leadTimeSeconds;
                normalizeLeadTimeSeconds();
            }
            if (saved.voiceRateVersion === 3 && saved.voiceRate && !isNaN(parseFloat(saved.voiceRate))) {
                document.getElementById('voiceRate').value = saved.voiceRate;
            } else {
                document.getElementById('voiceRate').value = '1.0';
            }
            if (saved.voiceGenderVersion === 2 && ['male', 'female'].includes(saved.voiceGender)) {
                document.querySelector(`input[name="voiceGender"][value="${saved.voiceGender}"]`).checked = true;
            } else {
                document.querySelector('input[name="voiceGender"][value="female"]').checked = true;
            }
            if ([1, 2, 3].includes(saved.groups)) {
                document.querySelector(`input[name="groups"][value="${saved.groups}"]`).checked = true;
            }
            if (saved.dark) {
                document.getElementById('themeToggle').checked = true;
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').innerText = '☀️';
            }
        } catch (error) {
            console.error("Settings load error:", error);
        }
    }

    // === 켜진 기능/그룹 수에 따른 입력 UI 갱신 ===
    function updateInputUI() {
        const isPicture = currentGroups > 1;
        const groupsSetting = getGroupsSetting();

        document.getElementById('bearingRow').style.display = isPicture ? 'none' : 'flex';
        document.getElementById('rangeRow').style.display =
            (!isPicture && document.getElementById('answerRangeMode').checked) ? 'flex' : 'none';

        // altitude 질문 라벨 (picture 모드는 지목된 그룹 명시)
        const altLabel = document.getElementById('altLabel');
        if (isPicture && groupsData.length > 0) {
            const groupName = capitalize(groupsData[altQuestionIdx].label.replace(' group', ''));
            altLabel.innerText = `Enter the altitude of ${groupName} (x1,000 ft)`;
        } else {
            altLabel.innerText = 'Enter the altitude of the target (x1,000 ft)';
        }

        buildAspectArea();

        // Groups>=2에서는 Answer Range·Easy를 dim 처리하고 Manual Plotting을 강제로 해제
        const dimForPicture = groupsSetting > 1;
        ['answerRangeMode', 'easyMode', 'plotMode'].forEach(id => {
            const el = document.getElementById(id);
            el.disabled = dimForPicture;
            el.parentElement.style.opacity = dimForPicture ? '0.4' : '1';
        });
        const plotMode = document.getElementById('plotMode');
        if (dimForPicture && plotMode.checked) {
            plotMode.checked = false;
            userMyPos = null;
            userTgtPos = null;
            if (themeColors.outerRing) drawRadar();
        }
    }

    // Aspect 답변 버튼 행 생성 (그룹 수만큼)
    function buildAspectArea() {
        const area = document.getElementById('aspectArea');
        area.innerHTML = '';
        if (!problemAspectOn) {
            area.style.display = 'none';
            userAspectAnswers = [];
            return;
        }
        area.style.display = 'block';

        const count = currentGroups === 1 ? 1 : Math.max(groupsData.length, 1);
        userAspectAnswers = new Array(count).fill(null);

        const instruction = document.createElement('div');
        instruction.className = 'answer-instruction';
        instruction.innerText = count === 1
            ? 'Choose the aspect of the target'
            : 'Choose the aspect of each group';
        area.appendChild(instruction);

        for (let i = 0; i < count; i++) {
            const row = document.createElement('div');
            row.className = 'aspect-row';
            if (count > 1) {
                const lab = document.createElement('span');
                lab.className = 'aspect-label';
                lab.innerText = groupsData[i] ? shortLabel(groupsData[i].label) : `G${i + 1}`;
                row.appendChild(lab);
            }
            ['HOT', 'FLANK', 'BEAM', 'COLD'].forEach(cls => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'aspect-btn';
                btn.innerText = cls;
                btn.addEventListener('click', () => {
                    userAspectAnswers[i] = cls;
                    row.querySelectorAll('.aspect-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
                row.appendChild(btn);
            });
            area.appendChild(row);
        }
    }

    function updateScoreDisplay() {
        let percentage = totalAttempts === 0 ? 0 : Math.round((correctAnswers / totalAttempts) * 100);
        document.getElementById('rateDisplay').innerText = `Score: ${percentage}% (${correctAnswers}/${totalAttempts})`;
    }

    function checkAnswer() {
        if (isAnimating || isTargetCallPending) return;

        itemResults = [];

        if (currentGroups === 1) {
            if (tgtData.rng === 0 && tgtData.brg === 0) return;

            const bearingVal = parseInt(document.getElementById('inputBearing').value, 10);
            const altVal = parseInt(document.getElementById('inputAlt').value, 10);
            if (isNaN(bearingVal) || isNaN(altVal)) {
                alert("Bearing과 Alt 값을 입력해주세요.");
                return;
            }
            const rangeOn = document.getElementById('answerRangeMode').checked;
            let rangeVal = null;
            if (rangeOn) {
                rangeVal = parseInt(document.getElementById('inputRange').value, 10);
                if (isNaN(rangeVal)) {
                    alert("Range 값을 입력해주세요.");
                    return;
                }
            }
            if (problemAspectOn && !userAspectAnswers[0]) {
                alert("Aspect를 선택해주세요.");
                return;
            }

            let diff = Math.abs(bearingVal - trueBearing) % 360;
            let finalDiff = diff > 180 ? 360 - diff : diff;
            itemResults.push({
                type: 'bearing',
                label: 'Bearing',
                ok: finalDiff <= 20,
                userAns: `${bearingVal.toString().padStart(3, '0')}°`,
                correctAns: `${trueBearing.toString().padStart(3, '0')}°`
            });
            if (rangeOn) {
                itemResults.push({
                    type: 'range',
                    label: 'Range',
                    ok: Math.abs(rangeVal - trueRange) <= 10,
                    userAns: `${rangeVal} nm`,
                    correctAns: `${trueRange} nm`
                });
            }
            itemResults.push({
                type: 'altitude',
                label: 'Altitude',
                ok: altVal === tgtData.alt / 1000,
                userAns: `${(altVal * 1000).toLocaleString('en-US')} ft`,
                correctAns: `${tgtData.alt.toLocaleString('en-US')} ft`
            });
            if (problemAspectOn) {
                const actual = classifyAspect(aspectAngle(positToXY(tgtData.brg, tgtData.rng), tgtData.hdg));
                itemResults.push({
                    type: 'aspect',
                    label: 'Aspect',
                    ok: userAspectAnswers[0] === actual,
                    userAns: userAspectAnswers[0],
                    correctAns: actual
                });
            }
        } else {
            if (groupsData.length === 0) return;

            if (userClicks.length < groupsData.length + 1) {
                alert(`캔버스에 위치를 모두 찍어주세요. (내 기체 1 + 그룹 ${groupsData.length})`);
                return;
            }
            const altVal = parseInt(document.getElementById('inputAlt').value, 10);
            if (isNaN(altVal)) {
                alert("Alt 값을 입력해주세요.");
                return;
            }
            if (problemAspectOn && userAspectAnswers.some(a => !a)) {
                alert("모든 그룹의 Aspect를 선택해주세요.");
                return;
            }

            // 위치: 클릭 좌표와 실제 좌표 거리 15nm 이내 (ownship 포함 각각 1항목)
            const tolPx = 15 * SCALE;
            const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
            const ownXY = positToXY(myData.brg, myData.rng);
            const ownPix = { x: CENTER + ownXY.x * SCALE, y: CENTER + ownXY.y * SCALE };
            itemResults.push({
                type: 'position',
                label: 'Position',
                groupIndex: -1,
                ok: dist(userClicks[0], ownPix) <= tolPx,
                userAns: '—',
                correctAns: '—'
            });
            groupsData.forEach((g, i) => {
                const gPix = { x: CENTER + g.x * SCALE, y: CENTER + g.y * SCALE };
                itemResults.push({
                    type: 'position',
                    label: 'Position',
                    groupIndex: i,
                    ok: dist(userClicks[i + 1], gPix) <= tolPx,
                    userAns: '—',
                    correctAns: '—'
                });
                if (problemAspectOn) {
                    const actual = classifyAspect(aspectAngle({ x: g.x, y: g.y }, g.hdg));
                    itemResults.push({
                        type: 'aspect',
                        label: 'Aspect',
                        groupIndex: i,
                        ok: userAspectAnswers[i] === actual,
                        userAns: userAspectAnswers[i],
                        correctAns: actual
                    });
                }
                if (i === altQuestionIdx) {
                    itemResults.push({
                        type: 'altitude',
                        label: 'Altitude',
                        groupIndex: i,
                        ok: altVal === g.alt / 1000,
                        userAns: `${(altVal * 1000).toLocaleString('en-US')} ft`,
                        correctAns: `${g.alt.toLocaleString('en-US')} ft`
                    });
                }
            });
        }

        isChecked = true;
        isCorrect = itemResults.every(r => r.ok);

        // 항목 단위 집계 (같은 문제 재제출 시 이중 집계 금지)
        if (!isCurrentProblemScored) {
            itemResults.forEach(r => {
                totalAttempts++;
                if (r.ok) correctAnswers++;
            });
            isCurrentProblemScored = true;
        }

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';
        renderResultTable(itemResults);
        document.getElementById('answerFieldset').hidden = true;

        updateTargetPositUI();
        updateScoreDisplay();
        startAnimateRadar();
        startCountdown();
    }

    function renderResultTable(results) {
        const resultBox = document.getElementById('resultBox');
        const table = document.createElement('table');
        table.className = 'data-table result-table';

        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['Item', 'Result', 'Your answer', 'Correct answer'].forEach(label => {
            const th = document.createElement('th');
            th.textContent = label;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        const appendResultRow = result => {
            const row = document.createElement('tr');
            const labelCell = document.createElement('td');
            labelCell.textContent = result.label;

            const statusCell = document.createElement('td');
            const status = document.createElement('span');
            status.className = `result-status ${result.ok ? 'result-correct' : 'result-incorrect'}`;
            status.textContent = result.ok ? '●' : '✕';
            status.setAttribute('aria-label', result.ok ? 'Correct' : 'Incorrect');

            const userAnswerCell = document.createElement('td');

        };

            const row = document.createElement('tr');

            const cell = document.createElement('th');
            cell.colSpan = 4;
            cell.scope = 'rowgroup';

            groupLabel.className = 'group-label';

                const badge = document.createElement('span');
                badge.className = 'group-number-badge';
                badge.textContent = number;
                groupLabel.appendChild(badge);

            groupLabel.appendChild(text);

    function startCountdown() {
        clearTimeout(autoRefreshTimeout);
        clearInterval(countdownInterval);

        const isAutoRefresh = document.getElementById('autoRefreshMode').checked;
        const btn = document.getElementById('btnGenerate');

        if (!isAutoRefresh) {
            btn.innerText = "GENERATE";
            return;
        }

        let timeLeft = parseInt(document.getElementById('refreshInterval').value, 10);
        if (isNaN(timeLeft) || timeLeft <= 0) timeLeft = 10;

        btn.innerText = `GENERATE (refresh in ${timeLeft}s)`;

        countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                btn.innerText = `GENERATE (refresh in ${timeLeft}s)`;
            } else {
                clearInterval(countdownInterval);
            }
        }, 1000);

        autoRefreshTimeout = setTimeout(() => {
            btn.style.transform = 'scale(0.97)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 100);
            generatePosits();
        }, timeLeft * 1000);
    }

    function startAnimateRadar() {
        isAnimating = true;
        animationStartTime = performance.now();
        requestAnimationFrame(animateLoop);
    }

    function animateLoop(currentTime) {
        if (!isAnimating) return;
        const elapsedTime = currentTime - animationStartTime;
        let progress = elapsedTime / ANIMATION_DURATION;
        if (progress > 1) progress = 1;

        drawRadar(progress);

        if (progress < 1) {
            requestAnimationFrame(animateLoop);
        } else {
            isAnimating = false;
        }
    }

    function lerp(start, end, amt) {
        return start + (end - start) * amt;
    }

    function drawRadar(progress = 1) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const showBearingLines = document.getElementById('showBraMode').checked;

        [50, 100].forEach(rng => {
            ctx.beginPath();
            ctx.arc(CENTER, CENTER, rng * SCALE, 0, 2 * Math.PI);
            ctx.strokeStyle = themeColors.highlightRange;
            ctx.setLineDash([]);
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        const cardinalBearings = [0, 90, 180, 270];
        cardinalBearings.forEach(deg => {
            const rad = deg * (Math.PI / 180);
            const endX = CENTER + RADIUS * Math.sin(rad);
            const endY = CENTER - RADIUS * Math.cos(rad);

            ctx.beginPath();
            ctx.moveTo(CENTER, CENTER);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = themeColors.gridDark;
            ctx.setLineDash([]);
            ctx.stroke();
        });

        if (showBearingLines) {
            const specialBearings = [0, 45, 90, 135, 180, 225, 270, 315];
            for (let deg = 0; deg < 360; deg += 15) {
                if (cardinalBearings.includes(deg)) continue;

                const rad = deg * (Math.PI / 180);
                const endX = CENTER + RADIUS * Math.sin(rad);
                const endY = CENTER - RADIUS * Math.cos(rad);

                ctx.beginPath();
                ctx.moveTo(CENTER, CENTER);
                ctx.lineTo(endX, endY);

                if (specialBearings.includes(deg)) {
                    ctx.strokeStyle = themeColors.gridDark;
                    ctx.setLineDash([]);
                } else {
                    ctx.strokeStyle = themeColors.gridLight;
                    ctx.setLineDash([4, 4]);
                }
                ctx.stroke();
            }
        }

        ctx.setLineDash([]);

        ctx.beginPath();
        ctx.arc(CENTER, CENTER, RADIUS, 0, 2 * Math.PI);
        ctx.strokeStyle = themeColors.outerRing;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        if (showBearingLines) {
            ctx.font = "bold 13px 'Segoe UI', Arial, sans-serif";
            ctx.fillStyle = themeColors.textBearing;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            for (let deg = 0; deg < 360; deg += 15) {
                const rad = deg * (Math.PI / 180);
                const degText = deg === 0 ? "360" : deg.toString().padStart(3, '0');

                const textWidth = ctx.measureText(degText).width;
                const textHeight = 10;
                const gap = 3;

                const dynamicOffset = (textWidth / 2) * Math.abs(Math.sin(rad)) + (textHeight / 2) * Math.abs(Math.cos(rad));
                const totalRadius = RADIUS + gap + dynamicOffset;

                const textX = CENTER + totalRadius * Math.sin(rad);
                const textY = CENTER - totalRadius * Math.cos(rad);

                ctx.fillText(degText, textX, textY);
            }

        }

        ctx.font = "10px 'Segoe UI', Arial, sans-serif";
        ctx.fillStyle = themeColors.textRange;
        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";

        const labelRanges = [50, 100];
        labelRanges.forEach(rng => {
            const dist = rng * SCALE;
            const text = rng.toString();

            ctx.fillText(text, CENTER + 3, CENTER - dist - 3);
            ctx.fillText(text, CENTER + 3, CENTER + dist - 3);
            ctx.fillText(text, CENTER + dist + 3, CENTER - 3);
            ctx.fillText(text, CENTER - dist + 3, CENTER - 3);
        });

        ctx.strokeStyle = themeColors.bullseye;
        ctx.lineWidth = 1;
        for (let r = 5; r <= 15; r += 5) {
            ctx.beginPath();
            ctx.arc(CENTER, CENTER, r, 0, 2 * Math.PI);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(CENTER, CENTER, 3, 0, 2 * Math.PI);
        ctx.fillStyle = '#e74c3c';
        ctx.fill();

        // picture(Groups>=2) 모드는 별도 오버레이로 그린다
        if (currentGroups > 1) {
            drawPictureOverlay();
            return;
        }

        const easyMode = document.getElementById('easyMode').checked;

        const myRad = myData.brg * (Math.PI / 180);
        const myX = CENTER + (myData.rng * Math.sin(myRad) * SCALE);
        const myY = CENTER - (myData.rng * Math.cos(myRad) * SCALE);

        const tgtRad = tgtData.brg * (Math.PI / 180);
        const tgtX = CENTER + (tgtData.rng * Math.sin(tgtRad) * SCALE);
        const tgtY = CENTER - (tgtData.rng * Math.cos(tgtRad) * SCALE);

        if (!easyMode && !isChecked) {
            if (userMyPos) {
                ctx.beginPath();
                ctx.arc(userMyPos.x, userMyPos.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#3498db';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            if (userTgtPos) {
                ctx.beginPath();
                ctx.arc(userTgtPos.x, userTgtPos.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(userMyPos.x, userMyPos.y);
                ctx.lineTo(userTgtPos.x, userTgtPos.y);
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--dash-line-color').trim();
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        if (isChecked && userMyPos) {
            ctx.beginPath();
            ctx.arc(userMyPos.x, userMyPos.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
            ctx.fill();
        }
        if (isChecked && userTgtPos) {
            ctx.beginPath();
            ctx.arc(userTgtPos.x, userTgtPos.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';
            ctx.fill();
        }

        if (easyMode || isChecked) {
            ctx.beginPath();
            ctx.arc(myX, myY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#3498db';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(tgtX, tgtY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
        }

        if (isChecked) {
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(myX, myY);

            if (progress <= 0.5) {
                const p1 = progress * 2;
                ctx.lineTo(lerp(myX, CENTER, p1), lerp(myY, CENTER, p1));
            } else {
                ctx.lineTo(CENTER, CENTER);
                const p2 = (progress - 0.5) * 2;
                ctx.lineTo(lerp(CENTER, tgtX, p2), lerp(CENTER, tgtY, p2));
            }
            ctx.stroke();

            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(myX, myY);
            ctx.lineTo(lerp(myX, tgtX, progress), lerp(myY, tgtY, progress));
            ctx.stroke();

            if (problemAspectOn) drawTrackArrow(tgtX, tgtY, tgtData.hdg);
        }
    }

    // 화살표 꼬리를 target 마커의 진행 방향 쪽 바깥 가장자리에서 시작
    function drawTrackArrow(x, y, heading) {
        const rad = heading * (Math.PI / 180);
        const ux = Math.sin(rad);
        const uy = -Math.cos(rad);
        const markerOuterEdge = 7;
        const arrowLength = 26;
        const startX = x + ux * markerOuterEdge;
        const startY = y + uy * markerOuterEdge;
        const endX = startX + ux * arrowLength;
        const endY = startY + uy * arrowLength;
        const angle = Math.atan2(endY - startY, endX - startX);
        const headSize = 7;

        ctx.save();
        ctx.strokeStyle = '#f39c12';
        ctx.fillStyle = '#f39c12';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headSize * Math.cos(angle - Math.PI / 6), endY - headSize * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(endX - headSize * Math.cos(angle + Math.PI / 6), endY - headSize * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    // picture 모드 오버레이: 사용자 클릭 마커 + 제출 후 실제 위치·허용 반경(15nm) 원
    function drawPictureOverlay() {
        userClicks.forEach((p, i) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 7, 0, 2 * Math.PI);
            ctx.fillStyle = i === 0 ? '#3498db' : '#e74c3c';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            if (i > 0) {
                ctx.fillStyle = '#fff';
                ctx.font = "bold 9px 'Segoe UI', Arial, sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(i), p.x, p.y);
            }
        });

        if (!isChecked || groupsData.length === 0) return;

        const tolPx = 15 * SCALE;
        const ownXY = positToXY(myData.brg, myData.rng);
        const ownshipPositionResult = itemResults.find(result => result.type === 'position' && result.groupIndex === -1);
        const points = [{
            x: CENTER + ownXY.x * SCALE,
            y: CENTER + ownXY.y * SCALE,
            color: '#3498db',
            ok: ownshipPositionResult && ownshipPositionResult.ok
        }];
        groupsData.forEach((g, i) => {
            const positionResult = itemResults.find(result => result.type === 'position' && result.groupIndex === i);
            points.push({
                x: CENTER + g.x * SCALE,
                y: CENTER + g.y * SCALE,
                color: '#e74c3c',
                ok: positionResult && positionResult.ok,
                num: i + 1
            });
        });

        points.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, tolPx, 0, 2 * Math.PI);
            ctx.strokeStyle = p.ok ? '#2ecc71' : '#e74c3c';
            ctx.setLineDash([4, 4]);
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
            ctx.fillStyle = p.color;
            ctx.fill();

            if (p.num) {
                ctx.fillStyle = p.ok ? '#2ecc71' : '#e74c3c';
                ctx.font = "bold 11px 'Segoe UI', Arial, sans-serif";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(String(p.num), p.x + 10, p.y - 10);
            }
        });

        if (problemAspectOn) {
            groupsData.forEach(g => {
                drawTrackArrow(CENTER + g.x * SCALE, CENTER + g.y * SCALE, g.hdg);
            });
        }
    }

    init();
</script>

</body>
</html>
