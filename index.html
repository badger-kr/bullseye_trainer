<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Free browser-based Bullseye Trainer for DCS pilots. Practice BRA calculations, manual plotting, and situational awareness with voice support.">
    <meta name="keywords" content="DCS World, Falcon BMS, Bullseye, Bullseye Trainer, BRA calculation, Flight Sim, VRAF, Badger, Situational Awareness">
    <meta name="author" content="Badger">

    <meta property="og:title" content="DCS Bullseye Trainer v0.2 by Badger">
    <meta property="og:description" content="Sharpen your tactical skills with this interactive Bullseye training tool.">
    <meta property="og:image" content="https://badger-kr.github.io/bullseye_trainer/preview.png"> <meta property="og:url" content="https://badger-kr.github.io/bullseye_trainer/">
    <title>Bullseye Trainer</title>
    <style>
        /* Light & Dark 테마 색상 변수 정의 */
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #2c3e50;
            --muted-color: #7f8c8d;
            --border-color: #bdc3c7;
            --input-bg: #ffffff;
            --canvas-bg: #fdfdfd;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --dash-line-color: rgba(0, 0, 0, 0.4);

            /* BRA Grid 색상 (Light Mode) */
            --bra-grid-dark: rgba(0, 0, 0, 0.4);
            --bra-grid-light: rgba(0, 0, 0, 0.15);
            --bra-highlight-range: #ff9999;
            --bra-text-range: #c0392b;
            --bra-text-bearing: #2c3e50;
            --bra-outer-ring: #000000;
            --bra-bullseye: rgba(0, 0, 0, 0.5);
        }

        body.dark-mode {
            --bg-color: #1a252f;
            --panel-bg: #2c3e50;
            --text-color: #ecf0f1;
            --muted-color: #95a5a6;
            --border-color: #5c6a79;
            --input-bg: #34495e;
            --canvas-bg: #22313f;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --dash-line-color: rgba(255, 255, 255, 0.5);

            /* BRA Grid 색상 (Dark Mode) */
            --bra-grid-dark: rgba(255, 255, 255, 0.5);
            --bra-grid-light: rgba(255, 255, 255, 0.15);
            --bra-highlight-range: rgba(255, 118, 117, 0.8);
            --bra-text-range: #ff7675;
            --bra-text-bearing: #ffffff;
            --bra-outer-ring: rgba(255, 255, 255, 0.7);
            --bra-bullseye: rgba(255, 255, 255, 0.6);
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
            padding: 10px;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-container {
            position: relative;
            display: grid;
            grid-template-columns: 410px 400px;
            grid-template-areas:
                "main radar"
                "answer radar"
                "result radar"
                "footer footer";
            background-color: var(--panel-bg);
            padding: 38px 24px 24px;
            column-gap: 20px;
            row-gap: 9px;
            align-items: start;
            border-radius: 15px;
            box-shadow: 0 10px 20px var(--shadow-color);
            max-width: 100%;
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .settings-toggle {
            position: absolute;
            top: 10px;
            right: 14px;
            cursor: pointer;
            user-select: none;
            font-size: 19px;
            line-height: 1;
            z-index: 30;
            width: 34px;
            height: 34px;
            margin: 0;
            padding: 0;
            border-radius: 50%;
            background-color: transparent;
            color: var(--text-color);
        }
        .settings-toggle:hover,
        .settings-toggle[aria-expanded="true"] {
            background-color: var(--bg-color);
        }
        .guide-link {
            position: absolute;
            top: 10px;
            right: 54px;
            z-index: 30;
            display: inline-flex;
            width: 34px;
            height: 34px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
        }
        .guide-link:hover {
            background-color: var(--bg-color);
        }
        .settings-panel {
            position: absolute;
            top: 48px;
            right: 14px;
            z-index: 25;
            width: min(320px, calc(100vw - 28px));
            max-height: calc(100vh - 64px);
            overflow-y: auto;
            padding: 14px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            box-shadow: 0 10px 24px var(--shadow-color);
        }
        .settings-panel[hidden] {
            display: none;
        }
        .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .theme-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .settings-panel fieldset + fieldset {
            margin-top: 10px;
        }

        .left-panel {
            grid-area: main;
            display: flex;
            flex-direction: column;
            width: 410px;
            gap: 9px;
        }

        .title-container {
            text-align: center;
            margin-bottom: 0;
        }
        .title-container h1 {
            margin: 0;
            font-size: 26px;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .title-container .subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: var(--muted-color);
            transition: color 0.3s;
        }
        .badger-credit {
            font-weight: bold;
            font-size: 15px;
            color: #e67e22;
        }

        .right-panel {
            grid-area: radar;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .call-countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 5;
            display: flex;
            width: 72px;
            height: 72px;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            background: rgba(231, 76, 60, 0.9);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
            color: #fff;
            font-size: 42px;
            font-weight: 800;
            line-height: 1;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }
        .call-countdown[hidden] { display: none; }
        .call-countdown.countdown-pop {
            animation: countdown-pop 0.85s ease-out both;
        }
        @keyframes countdown-pop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.62); }
            22% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1.12); }
        }
        canvas {
            background-color: var(--canvas-bg);
            border-radius: 8px;
            border: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            max-width: 100%;
            height: auto;
            cursor: crosshair;
            touch-action: pan-y;
            transition: background-color 0.3s;
        }
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 0;
        }
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .plot-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            min-height: 25px;
        }
        .posit-options {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            margin-bottom: 10px;
            color: var(--muted-color);
            font-size: 12px;
        }
        .posit-option-row {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Auto Refresh Number Input Style */
        .refresh-input {
            width: 45px;
            padding: 3px;
            margin-left: 5px;
            text-align: center;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .voice-rate-input {
            flex: 1;
            min-width: 90px;
        }
        #voiceRateValue {
            width: 34px;
            text-align: right;
            font: bold 12px 'Courier New', Courier, monospace;
            color: var(--muted-color);
        }
        .voice-gender-options {
            display: inline-flex;
            gap: 8px;
            margin-left: auto;
        }
        .voice-gender-options label {
            white-space: nowrap;
        }

        #rateDisplay {
            font-size: 14px;
            font-weight: bold;
            color: var(--muted-color);
            transition: color 0.3s;
        }

        .help-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            background-color: var(--muted-color);
            color: var(--panel-bg);
            border-radius: 50%;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: help;
            margin-left: 6px;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }
        .help-icon::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 10px 14px;
            border-radius: 6px;
            width: 260px;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.5;
            text-align: left;
            white-space: pre-line;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .help-icon::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.85) transparent transparent transparent;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
            z-index: 100;
        }
        .help-icon:hover::after,
        .help-icon:hover::before,
        .help-icon:focus::after,
        .help-icon:focus::before {
            opacity: 1;
            visibility: visible;
        }
        .help-icon::after,
        .help-icon::before {
            display: none;
        }
        .help-tooltip-popup {
            position: fixed;
            z-index: 1000;
            width: min(280px, calc(100vw - 24px));
            padding: 10px 14px;
            border-radius: 6px;
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.5;
            text-align: left;
            white-space: pre-line;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        button {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
        fieldset {
            border: 1px solid var(--border-color);
            padding: 11px;
            margin: 0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        legend {
            font-size: 14px;
            color: var(--muted-color);
            padding: 0 10px;
            transition: color 0.3s;
        }
        .posit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 7px;
            font-size: 15px;
        }
        .posit-row:last-child {
            margin-bottom: 0;
        }
        .posit-value {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            width: 190px;
            text-align: right;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            border-radius: 4px;
            white-space: nowrap;
            transition: border-color 0.3s, opacity 0.15s;
        }
        .posit-value.own-bullseye-flash {
            animation: own-bullseye-flash 0.72s ease-in-out 2;
        }
        @keyframes own-bullseye-flash {
            0%, 100% { box-shadow: none; transform: scale(1); }
            50% {
                box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.24), 0 0 18px rgba(52, 152, 219, 0.9);
                transform: scale(1.035);
            }
        }
        .blue-bg { background-color: #3498db; color: white; border-color: #2980b9; }
        .red-bg { background-color: #e74c3c; color: white; border-color: #c0392b; }

        .target-section-label {
            margin: 8px 0 5px;
            font-size: 13px;
            font-weight: bold;
            color: #c0392b;
        }
        .target-table-wrap {
            overflow-x: auto;
            border: 1px solid #c0392b;
            border-radius: 6px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
        }
        .data-table th,
        .data-table td {
            padding: 5px 4px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            white-space: nowrap;
        }
        .data-table th:last-child,
        .data-table td:last-child {
            border-right: none;
        }
        .data-table tbody tr:last-child td {
            border-bottom: none;
        }
        .data-table th {
            background-color: rgba(127, 140, 141, 0.13);
            color: var(--muted-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 10px;
            text-transform: uppercase;
        }
        .target-table td {
            color: var(--text-color);
        }
        .target-table .formation-cell {
            color: #c0392b;
            font-weight: bold;
        }
        .target-table th:nth-child(1) { width: 20%; }
        .target-table th:nth-child(2) { width: 14%; }
        .target-table th:nth-child(3) { width: 27%; }
        .target-table th:nth-child(4) { width: 24%; }
        .target-table th:nth-child(5) { width: 15%; }
        .group-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .group-number-badge {
            display: inline-flex;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #e74c3c;
            color: #fff;
            font: bold 10px 'Segoe UI', Tahoma, sans-serif;
            line-height: 1;
        }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 6px;
            font-size: 15px;
        }
        .input-row input {
            width: 92px;
            flex: 0 0 92px;
            padding: 7px;
            text-align: center;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        #btnCheck {
            width: auto;
            margin-top: 0;
            padding: 8px 16px;
            font-size: 14px;
        }
        #answerFieldset {
            grid-area: answer;
            min-width: 0;
        }
        #answerFieldset:disabled {
            opacity: 0.5;
        }

        #resultBox {
            grid-area: result;
            min-width: 0;
            padding: 6px;
            display: none;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 0;
            background-color: var(--panel-bg);
        }
        .app-footer {
            grid-area: footer;
            padding-top: 3px;
            color: var(--muted-color);
            font-size: 11px;
            text-align: center;
        }
        .app-footer a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .result-table {
            table-layout: auto;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 12px;
        }
        .result-table th:nth-child(2),
        .result-table td:nth-child(2) {
            width: 58px;
        }
        .result-table th:nth-child(3),
        .result-table th:nth-child(4) {
            width: 27%;
        }
        .result-table td:first-child {
            text-align: left;
        }
        .result-group-heading th {
            padding: 6px 8px;
            text-align: left;
            background-color: rgba(231, 76, 60, 0.12);
            color: var(--text-color);
            font-size: 11px;
        }
        .result-group-heading.ownship-heading th {
            background-color: rgba(52, 152, 219, 0.12);
        }
        .result-status {
            display: inline-flex;
            width: 18px;
            height: 18px;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 900;
            line-height: 1;
        }
        .result-correct {
            color: #27ae60;
        }
        .result-incorrect {
            color: #e74c3c;
        }

        /* GENERATE + SAY AGAIN 한 행 배치 */
        .generate-row {
            display: flex;
            gap: 8px;
        }
        .generate-row #btnGenerate {
            flex: 1;
        }
        #btnSayAgain {
            width: auto;
            font-size: 13px;
            padding: 10px 12px;
            background-color: #16a085;
        }
        #btnSayAgain:hover {
            background-color: #117864;
        }
        #btnSayAgain:disabled {
            opacity: 0.5;
            cursor: default;
        }
        .auto-refresh-bar {
            justify-content: flex-end;
            padding: 0 4px;
            color: var(--muted-color);
        }
        .auto-refresh-bar label {
            color: var(--text-color);
        }

        /* Aspect 답변 버튼 행 (HOT/FLANK/BEAM/COLD) */
        .aspect-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 6px;
        }
        .aspect-label {
            font-size: 12px;
            font-weight: bold;
            min-width: 42px;
            text-align: right;
            color: var(--muted-color);
        }
        .aspect-btn {
            width: auto;
            margin-top: 0;
            padding: 6px 8px;
            font-size: 12px;
            font-weight: bold;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        .aspect-btn:hover {
            background-color: var(--border-color);
        }
        .aspect-btn.selected {
            background-color: #3498db;
            border-color: #2980b9;
            color: #fff;
        }

        .input-row label {
            flex: 1;
            font-size: 13px;
            line-height: 1.25;
            text-align: left;
        }
        .answer-instruction {
            margin-top: 7px;
            font-size: 13px;
            text-align: center;
            color: var(--muted-color);
        }
        .submit-row {
            justify-content: flex-end;
        }

        @media (max-width: 900px) {
            body {
                align-items: flex-start;
                padding: 4px;
            }
            .app-container {
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas:
                    "main"
                    "radar"
                    "answer"
                    "result"
                    "footer";
                overflow: visible;
                padding: 30px 8px 8px;
                gap: 7px;
                width: 100%;
                max-width: 430px;
                border-radius: 10px;
            }
            .left-panel {
                width: 100%;
                gap: 6px;
            }
            body {
                min-height: 100dvh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
            .title-container h1 { font-size: 21px; }
            .title-container .subtitle { margin-top: 1px; }
            .settings-toggle { top: 5px; right: 7px; }
            .guide-link { top: 5px; right: 47px; }
            .settings-panel {
                position: fixed;
                top: 44px;
                right: 7px;
                max-height: calc(100vh - 52px);
            }
            fieldset { padding: 7px; }
            .generate-row button { padding: 9px; }
            .posit-row { margin-bottom: 4px; }
            .target-section-label { margin-top: 5px; }
            .data-table th,
            .data-table td { padding: 4px 2px; }
            #resultBox { padding: 4px; }
            canvas {
                width: min(100%, 42vh);
                max-width: 380px;
            }
        }

        @media (max-width: 900px) and (max-height: 720px) {
            .title-container h1 { font-size: 18px; }
            .title-container .subtitle { font-size: 11px; }
            .badger-credit { font-size: 12px; }
            canvas { width: min(100%, 34vh); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <a class="guide-link" href="bullseye_manual.html" target="_blank" rel="noopener" aria-label="Open user guide" title="User Guide / 사용설명서">📘</a>
    <button type="button" class="settings-toggle" id="settingsToggle" aria-label="Open settings" aria-controls="settingsPanel" aria-expanded="false" title="Settings">⚙️</button>

    <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-header">
            <strong>Settings</strong>
            <label class="theme-option" title="Toggle Light/Dark Mode">
                <input type="checkbox" id="themeToggle">
                <span id="themeIcon">🌙</span> Dark mode
            </label>
        </div>

        <fieldset>
            <legend>Challenges</legend>
            <div class="plot-controls">
                <label><input type="checkbox" id="answerRangeMode"> Answer Range</label>
                <span class="help-icon" data-tooltip="단일 그룹 문제에서 내 기체와 타겟 사이의 거리도 함께 답합니다. 정답 허용 범위는 ±10nm입니다.

For a single-group problem, also enter the range from ownship to the target. The tolerance is ±10nm.">?</span>
            </div>
            <div class="plot-controls">
                <label><input type="checkbox" id="aspectMode"> Aspect</label>
                <span class="help-icon" data-tooltip="음성 콜에 각 그룹의 진행 방향(track)이 추가됩니다. 내 기체에서 본 움직임을 기준으로 HOT / FLANK / BEAM / COLD 중 하나를 선택합니다.

Adds each group's track to the voice call. Choose HOT, FLANK, BEAM, or COLD based on its movement relative to ownship.">?</span>

Choose 1 for a single target. With 2 or 3 groups, plot ownship first and then each group in call order. Group-position tolerance is 15nm.">?</span>

For single-group practice, shows the actual ownship and target positions on the scope before submission. Useful while learning position calculations.">?</span>

Shows or hides additional bearing lines and bearing numbers radiating from Bullseye. The east-west and north-south cross lines and the red 50nm and 100nm range rings are always visible.">?</span>
            </div>

Available only with Groups=1. Click ownship first, then click the calculated target position.">?</span>
            </div>

Plays the target information as an English voice call. When Voice is off, the target table shows the problem information after Lead Time.">?</span>

                    <label><input type="radio" name="voiceGender" value="male"> Male</label>
                    <label><input type="radio" name="voiceGender" value="female" checked> Female</label>
                </span>
                <span class="help-icon" tabindex="0" data-tooltip="브라우저에 설치된 영어 음성 중 선택한 성별과 가장 잘 맞는 음성을 우선 사용합니다. 일치하는 음성이 없으면 사용 가능한 영어 음성으로 자동 대체됩니다.

Prefers an installed English voice matching the selected gender. If none matches, the app automatically uses another available English voice.">?</span>
            </div>
            <div class="plot-controls">
                <label for="voiceRate">Voice speed</label>
                <input type="range" id="voiceRate" class="voice-rate-input" value="1.0" min="0.7" max="1.2" step="0.05">
                <output id="voiceRateValue" for="voiceRate">1.0×</output>
                <span class="help-icon" tabindex="0" data-tooltip="음성 콜의 재생 속도를 조절합니다. 기본값 1.0×는 이전 버전의 0.7×와 같은 실제 속도입니다.

Adjusts the voice-call playback speed. The default 1.0× has the same actual rate as 0.7× in the previous version.">?</span>
            </div>

    <div class="left-panel">

        <div class="title-container">
            <h1>BULLSEYE TRAINER</h1>
            <div class="subtitle"><span class="badger-credit">by Badger 🇰🇷</span> v0.2</div>

        <div class="controls-group">
            <div class="top-controls">
                <div style="display: flex; align-items: center; margin-left: auto;">
                    <span id="rateDisplay">Score: 0% (0/0)</span>

        <fieldset>
            <legend>Posit</legend>

                <span>Own Bullseye:</span>

                    <label><input type="checkbox" id="leadTimeMode" checked> Lead Time</label>

                    <span>s</span>
                    <span class="help-icon" tabindex="0" data-tooltip="Own Bullseye를 확인할 시간을 설정합니다. Generate를 누르면 설정한 시간이 지난 뒤 Target 정보와 음성 콜이 나옵니다. 체크를 끄면 즉시 시작합니다.

Sets how long you can review Own Bullseye before the target information and voice call begin. Turn it off to start the target call immediately.">?</span>
                </div>

                    <label><input type="checkbox" id="fixOwnBullseye"> Fix Own Bullseye</label>
                    <span class="help-icon" tabindex="0" data-tooltip="다음 문제를 생성해도 현재 Own Bullseye 위치를 그대로 유지합니다. 같은 위치에서 여러 콜을 연속으로 연습할 때 사용합니다.

Keeps the current Own Bullseye position when generating the next problem. Useful for practicing several calls from one location.">?</span>

    <fieldset id="answerFieldset">
        <legend>Answer <span class="help-icon" tabindex="0" data-tooltip="단일 그룹에서는 내 기체에서 타겟으로 향하는 방위와 타겟 고도를 입력합니다. 설정에 따라 거리와 aspect도 답합니다. 다중 그룹에서는 동심원에 내 기체를 먼저 찍고, 불러준 순서대로 모든 그룹을 찍은 뒤 질문받은 고도와 각 그룹의 aspect를 답합니다.

For one group, enter the bearing from ownship to target and the target altitude, plus range or aspect when enabled. For multiple groups, plot ownship and every group in call order, then answer the requested altitude and each group's aspect.">?</span></legend>
        <div class="input-row" id="bearingRow">
            <label for="inputBearing" id="bearingLabel">Enter the bearing from ownship to target</label>
            <input type="number" id="inputBearing" inputmode="numeric" pattern="[0-9]*" placeholder="000">
        </div>
        <div class="input-row" id="rangeRow" style="display: none;">
            <label for="inputRange">Enter the range from ownship to target (nm)</label>
            <input type="number" id="inputRange" inputmode="numeric" pattern="[0-9]*" placeholder="--">
        </div>
        <div class="input-row" id="altRow">
            <label for="inputAlt" id="altLabel">Enter the altitude of the target (x1,000 ft)</label>
            <input type="number" id="inputAlt" inputmode="numeric" pattern="[0-9]*" placeholder="--">
        </div>

<div id="helpTooltip" class="help-tooltip-popup" role="tooltip" hidden></div>

<script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');

    const CENTER = 200;
    const RADIUS = 170;
    const MAX_RANGE = 150;
    const MIN_RANGE = 30;
    const SCALE = RADIUS / MAX_RANGE;

    let myData = { brg: 0, rng: 0 };
    let tgtData = { brg: 0, rng: 0, alt: 0, hdg: 0 };
    let isCorrect = false;
    let isChecked = false;
    let trueBearing = 0;
    let trueRange = 0;

    // v0.2: picture(Groups>=2) 모드 상태
    let currentGroups = 1;        // 현재 문제의 그룹 수
    let groupsData = [];          // 콜 순서대로 정렬된 그룹 배열 {label, x, y, brg, rng, alt, hdg}
    let pictureShape = '';        // azimuth/range/wall/ladder/vic/champagne
    let azimuthSep = 0;           // azimuth 콜에 포함할 분리 거리(nm)
    let altQuestionIdx = 0;       // altitude 질문 대상 그룹 인덱스
    let userClicks = [];          // 플로팅 클릭 (첫번째=ownship)
    let userAspectAnswers = [];   // 그룹별 aspect 답 선택
    let lastUtterances = [];      // Say Again용 마지막 콜
    let itemResults = [];         // 항목별 채점 결과 {type, label, ok, userAns, correctAns, groupIndex}
    let problemAspectOn = false;  // 문제 생성 시점의 Aspect 토글 스냅샷

    let correctAnswers = 0;
    let totalAttempts = 0;
    let isCurrentProblemScored = false;

    let animationStartTime = 0;
    let isAnimating = false;
    const ANIMATION_DURATION = 300;

    let userMyPos = null;
    let userTgtPos = null;
    let myVoice = null;
    let speechSequenceToken = 0;

    let autoRefreshTimeout = null;
    let countdownInterval = null;
    let targetRevealTimeout = null;
    let targetCountdownInterval = null;
    let isTargetCallPending = false;

    const DEFAULT_LEAD_TIME_SECONDS = 3;
    const SPEECH_RATE_SCALE = 0.7;

    let themeColors = {};
    function updateThemeColors() {
        const rootStyle = getComputedStyle(document.body);
        themeColors.gridDark = rootStyle.getPropertyValue('--bra-grid-dark').trim() || 'rgba(0,0,0,0.4)';
        themeColors.gridLight = rootStyle.getPropertyValue('--bra-grid-light').trim() || 'rgba(0,0,0,0.15)';
        themeColors.highlightRange = rootStyle.getPropertyValue('--bra-highlight-range').trim() || '#ff9999';
        themeColors.textRange = rootStyle.getPropertyValue('--bra-text-range').trim() || '#c0392b';
        themeColors.textBearing = rootStyle.getPropertyValue('--bra-text-bearing').trim() || '#2c3e50';
        themeColors.outerRing = rootStyle.getPropertyValue('--bra-outer-ring').trim() || '#000000';
        themeColors.bullseye = rootStyle.getPropertyValue('--bra-bullseye').trim() || 'rgba(0,0,0,0.5)';
    }

    const VOICE_GENDER_HINTS = {
        male: ['alex', 'fred', 'daniel', 'aaron', 'david', 'guy', 'eric', 'matthew', 'joey', 'justin', 'brian', 'arthur', 'roger', 'ryan', 'christopher', 'liam', 'mark'],
        female: ['samantha', 'victoria', 'karen', 'allison', 'ava', 'susan', 'zira', 'aria', 'jenny', 'joanna', 'kimberly', 'salli', 'ivy', 'emma', 'olivia', 'michelle', 'sonia', 'natasha', 'google us english']
    };

    function getVoiceGenderSetting() {
        return document.querySelector('input[name="voiceGender"]:checked')?.value || 'female';
    }

    function voiceQualityScore(voice) {
        const name = voice.name.toLowerCase();
        if (name.includes('natural')) return 4;
        if (name.includes('premium')) return 3;
        if (name.includes('enhanced')) return 2;
        if (name.includes('google')) return 1;
        return 0;
    }

    function initVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        const englishVoices = voices.filter(voice => voice.lang.toLowerCase().startsWith('en'));
        const enUS = englishVoices.filter(voice => voice.lang.toLowerCase().includes('en-us'));
        const candidates = enUS.length > 0 ? enUS : englishVoices;
        const gender = getVoiceGenderSetting();
        const genderMatches = candidates.filter(voice =>
            VOICE_GENDER_HINTS[gender].some(hint => voice.name.toLowerCase().includes(hint))
        );
        const preferred = genderMatches.length > 0 ? genderMatches : candidates;
        myVoice = preferred.sort((a, b) => voiceQualityScore(b) - voiceQualityScore(a))[0] || null;
    }

    function primeSpeechSynthesis() {
        if (!('speechSynthesis' in window) || !document.getElementById('voiceMode').checked) return;

        try {
            const primer = new SpeechSynthesisUtterance('.');
            primer.lang = 'en-US';
            primer.volume = 0;
            window.speechSynthesis.resume();
            window.speechSynthesis.speak(primer);
        } catch (error) {
            console.warn('Speech synthesis preparation failed:', error);
        }
    }

    if ('speechSynthesis' in window) {
        initVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }
    }

    // 톱니바퀴 설정 패널 열기/닫기
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const helpTooltip = document.getElementById('helpTooltip');
    let activeHelpIcon = null;

    function hideSettingsHelp() {
        helpTooltip.hidden = true;
        activeHelpIcon = null;
    }

    function showSettingsHelp(icon) {
        const tooltipText = icon.dataset.tooltip;
        if (!tooltipText) return;
        activeHelpIcon = icon;
        helpTooltip.textContent = tooltipText;
        helpTooltip.hidden = false;
        helpTooltip.style.left = '12px';
        helpTooltip.style.top = '12px';

        const iconRect = icon.getBoundingClientRect();
        const tooltipRect = helpTooltip.getBoundingClientRect();
        const margin = 12;
        let left = iconRect.left + iconRect.width / 2 - tooltipRect.width / 2;
        left = Math.max(margin, Math.min(left, window.innerWidth - tooltipRect.width - margin));
        let top = iconRect.top - tooltipRect.height - 8;
        if (top < margin) top = iconRect.bottom + 8;
        top = Math.max(margin, Math.min(top, window.innerHeight - tooltipRect.height - margin));
        helpTooltip.style.left = `${left}px`;
        helpTooltip.style.top = `${top}px`;
    }

    document.querySelectorAll('.help-icon').forEach(icon => {
        icon.tabIndex = 0;
        icon.addEventListener('pointerenter', () => showSettingsHelp(icon));
        icon.addEventListener('pointerleave', () => {
            if (document.activeElement !== icon) hideSettingsHelp();
        });
        icon.addEventListener('focus', () => showSettingsHelp(icon));
        icon.addEventListener('blur', hideSettingsHelp);
        icon.addEventListener('click', event => {
            event.stopPropagation();
            showSettingsHelp(icon);
        });
    });

    settingsPanel.addEventListener('scroll', hideSettingsHelp);
    window.addEventListener('scroll', hideSettingsHelp);
    window.addEventListener('resize', hideSettingsHelp);
    window.addEventListener('resize', alignRadarWithGenerateButtons);

    function setSettingsOpen(isOpen) {
        settingsPanel.hidden = !isOpen;
        if (!isOpen) hideSettingsHelp();
        settingsToggle.setAttribute('aria-expanded', String(isOpen));
        settingsToggle.setAttribute('aria-label', isOpen ? 'Close settings' : 'Open settings');
    }

    settingsToggle.addEventListener('click', function() {
        setSettingsOpen(settingsPanel.hidden);
    });

    document.addEventListener('pointerdown', function(event) {
        if (!settingsPanel.hidden && !settingsPanel.contains(event.target) && !settingsToggle.contains(event.target)) {
            setSettingsOpen(false);
        }
    });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape' && !settingsPanel.hidden) setSettingsOpen(false);
    });

    document.getElementById('themeToggle').addEventListener('change', function() {
        if (this.checked) {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').innerText = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('themeIcon').innerText = '🌙';
        }
        setTimeout(() => {
            updateThemeColors();
            drawRadar();
        }, 0);
        saveSettings();
    });

    document.getElementById('plotMode').addEventListener('change', function() {
        if (!this.checked) {
            userMyPos = null;
            userTgtPos = null;
            drawRadar();
        }
    });

    // v0.2: Challenges 토글/라디오 변경 시 입력 UI 갱신 + 설정 저장
    document.getElementById('answerRangeMode').addEventListener('change', updateInputUI);
    document.getElementById('aspectMode').addEventListener('change', function() {
        problemAspectOn = this.checked;
        updateInputUI();
    });
    document.querySelectorAll('input[name="groups"]').forEach(radio => {
        radio.addEventListener('change', updateInputUI);
    });

    // 모든 토글/설정 변경 시 localStorage 저장
    ['easyMode', 'voiceMode', 'showBraMode', 'plotMode', 'autoRefreshMode',
     'fixOwnBullseye', 'answerRangeMode', 'aspectMode'].forEach(id => {
        document.getElementById(id).addEventListener('change', saveSettings);
    });
    document.getElementById('leadTimeMode').addEventListener('change', function() {
        updateLeadTimeControl();
        saveSettings();
    });
    document.getElementById('leadTimeSeconds').addEventListener('change', function() {
        normalizeLeadTimeSeconds();
        saveSettings();
    });
    document.querySelectorAll('input[name="groups"]').forEach(radio => {
        radio.addEventListener('change', saveSettings);
    });
    document.querySelectorAll('input[name="voiceGender"]').forEach(radio => {
        radio.addEventListener('change', function() {
            initVoices();
            saveSettings();
        });
    });
    document.getElementById('refreshInterval').addEventListener('input', saveSettings);
    document.getElementById('voiceRate').addEventListener('input', function() {
        document.getElementById('voiceRateValue').value = `${parseFloat(this.value).toFixed(2).replace(/0$/, '')}×`;
        saveSettings();
    });

    document.getElementById('showBraMode').addEventListener('change', drawRadar);

    // Auto Refresh 토글 시 카운트다운 정지/재개 로직
    document.getElementById('autoRefreshMode').addEventListener('change', function() {
        if (!this.checked) {
            clearTimeout(autoRefreshTimeout);
            clearInterval(countdownInterval);
            document.getElementById('btnGenerate').innerText = "GENERATE";
        } else if (isChecked) {
            // 정답 제출 상태에서 체크박스를 켜면 즉시 카운트다운 다시 시작
            startCountdown();
        }
    });

    // 시간 숫자 변경 시 즉각 반영
    document.getElementById('refreshInterval').addEventListener('input', function() {
        if (isChecked && document.getElementById('autoRefreshMode').checked) {
            startCountdown();
        }
    });

    document.getElementById('btnGenerate').addEventListener('click', function(e) {
        const btn = e.target;
        btn.style.transform = 'scale(0.97)';
        setTimeout(() => { btn.style.transform = 'scale(1)'; }, 100);
        generatePosits();
        if (isTargetCallPending) primeSpeechSynthesis();
    });

    document.getElementById('btnCheck').addEventListener('click', checkAnswer);
    document.getElementById('easyMode').addEventListener('change', drawRadar);
    document.getElementById('voiceMode').addEventListener('change', function() {
        if (!this.checked && 'speechSynthesis' in window) {
            speechSequenceToken++;
            window.speechSynthesis.cancel();
        }
        updateTargetPositUI();
        updateSayAgainState();
    });

    // Say Again: 마지막 콜 전체 재생
    document.getElementById('btnSayAgain').addEventListener('click', function() {
        playUtterances(lastUtterances);
    });

    ['inputBearing', 'inputRange', 'inputAlt'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                this.blur();
                checkAnswer();
            }
        });
    });

    canvas.addEventListener('click', function(event) {
        if (isTargetCallPending) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = (event.clientX - rect.left) * scaleX;
        const y = (event.clientY - rect.top) * scaleY;

        // picture 모드: 첫 클릭 = ownship, 이후 콜 순서대로 그룹. 초과 시 처음부터 다시.
        if (currentGroups > 1) {
            if (isChecked || groupsData.length === 0) return;
            if (userClicks.length >= groupsData.length + 1) userClicks = [];
            userClicks.push({x, y});
            drawRadar();
            return;
        }

        if (getGroupsSetting() !== 1) return;

        const plotMode = document.getElementById('plotMode').checked;
        if (!plotMode) return;

        const easyMode = document.getElementById('easyMode').checked;
        if (easyMode || isChecked) return;

        if (!userMyPos) {
            userMyPos = {x, y};
        } else if (!userTgtPos) {
            userTgtPos = {x, y};
        } else {
            userMyPos = {x, y};
            userTgtPos = null;
        }
        drawRadar();
    });

    function init() {
        loadSettings();
        initVoices();
        document.getElementById('voiceRateValue').value = `${getVoiceRate().toFixed(2).replace(/0$/, '')}×`;
        updateLeadTimeControl();
        currentGroups = getGroupsSetting();
        problemAspectOn = document.getElementById('aspectMode').checked;
        updateInputUI();
        updateTargetPositUI();
        updateSayAgainState();
        updateThemeColors();
        alignRadarWithGenerateButtons();
        drawRadar();
        saveSettings();
    }

    function alignRadarWithGenerateButtons() {
        const radarPanel = document.querySelector('.right-panel');
        if (window.innerWidth <= 900) {
            radarPanel.style.marginTop = '0';
            return;
        }

        const leftPanelTop = document.querySelector('.left-panel').getBoundingClientRect().top;
        const generateTop = document.getElementById('btnGenerate').getBoundingClientRect().top;
        radarPanel.style.marginTop = `${Math.max(0, Math.round(generateTop - leftPanelTop))}px`;
    }

    function generatePosits() {
        try {
            clearTimeout(autoRefreshTimeout);
            clearInterval(countdownInterval);
            cancelTargetCallSequence();
            speechSequenceToken++;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            lastUtterances = [];
            updateSayAgainState();
            document.getElementById('btnGenerate').innerText = "GENERATE";

            isAnimating = false;
            isCorrect = false;
            isChecked = false;
            isCurrentProblemScored = false;

            userMyPos = null;
            userTgtPos = null;
            userClicks = [];
            itemResults = [];

            currentGroups = getGroupsSetting();
            problemAspectOn = document.getElementById('aspectMode').checked;

            const isFixOwn = document.getElementById('fixOwnBullseye').checked;
            if (!isFixOwn || myData.rng === 0) {
                myData.brg = Math.floor(Math.random() * 361);
                myData.rng = Math.floor(Math.random() * (MAX_RANGE - MIN_RANGE + 1)) + MIN_RANGE;
            }

            if (currentGroups === 1) {
                groupsData = [];
                // aspect 경계 회피가 가능한 위치가 나올 때까지 재생성
                for (let i = 0; i < 100; i++) {
                    tgtData.brg = Math.floor(Math.random() * 361);
                    tgtData.rng = Math.floor(Math.random() * (MAX_RANGE - MIN_RANGE + 1)) + MIN_RANGE;
                    const hdg = pickHeading(positToXY(tgtData.brg, tgtData.rng));
                    if (hdg !== null) { tgtData.hdg = hdg; break; }
                }
                tgtData.alt = randomAlt();
                calculateTrueBearing();
            } else {
                const groups = generatePicture(currentGroups);
                if (!groups) throw new Error('picture generation failed');
                groupsData = groups;
                altQuestionIdx = Math.floor(Math.random() * groupsData.length);
            }

            const myPositEl = document.getElementById('myPosit');
            myPositEl.innerText = `${myData.brg}° | ${myData.rng} nm`;
            myPositEl.style.opacity = '1';

            const inputField = document.getElementById('inputBearing');
            inputField.value = '';
            document.getElementById('inputRange').value = '';
            document.getElementById('inputAlt').value = '';
            updateInputUI();

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';
            document.getElementById('answerFieldset').hidden = false;

            drawRadar();
            startTargetCallSequence();

        } catch (error) {
            cancelTargetCallSequence();
            console.error("Critical error during Generation:", error);
            alert("문제 생성 중 예외 오류가 발생했습니다. 브라우저를 새로고침 해주세요.");
        }
    }

    function cancelTargetCallSequence() {
        clearTimeout(targetRevealTimeout);
        clearInterval(targetCountdownInterval);
        targetRevealTimeout = null;
        targetCountdownInterval = null;
        isTargetCallPending = false;
        document.getElementById('callCountdown').hidden = true;
        document.getElementById('answerFieldset').disabled = false;
    }

    function showCallCountdown(value) {
        const countdown = document.getElementById('callCountdown');
        countdown.textContent = value;
        countdown.hidden = false;
        countdown.classList.remove('countdown-pop');
        void countdown.offsetWidth;
        countdown.classList.add('countdown-pop');
    }

    function flashOwnBullseye() {
        const myPositEl = document.getElementById('myPosit');
        myPositEl.classList.remove('own-bullseye-flash');
        void myPositEl.offsetWidth;
        myPositEl.classList.add('own-bullseye-flash');
    }

    function normalizeLeadTimeSeconds() {
        const input = document.getElementById('leadTimeSeconds');
        const parsed = parseInt(input.value, 10);
        const seconds = Number.isFinite(parsed)
            ? Math.min(30, Math.max(1, parsed))
            : DEFAULT_LEAD_TIME_SECONDS;
        input.value = seconds;
        return seconds;
    }

    function updateLeadTimeControl() {
        const enabled = document.getElementById('leadTimeMode').checked;
        document.getElementById('leadTimeSeconds').disabled = !enabled;
    }

    function revealTargetCall() {
        clearInterval(targetCountdownInterval);
        targetCountdownInterval = null;
        targetRevealTimeout = null;
        isTargetCallPending = false;
        document.getElementById('callCountdown').hidden = true;
        document.getElementById('answerFieldset').disabled = false;
        updateTargetPositUI();
        speakUtterances(buildCallUtterances());

        if (currentGroups === 1) {
            setTimeout(() => document.getElementById('inputBearing').focus(), 50);
        }
    }

    function startTargetCallSequence() {
        cancelTargetCallSequence();
        flashOwnBullseye();

        if (!document.getElementById('leadTimeMode').checked) {
            revealTargetCall();
            return;
        }

        isTargetCallPending = true;
        document.getElementById('answerFieldset').disabled = true;
        updateTargetPositUI();

        const leadTimeSeconds = normalizeLeadTimeSeconds();
        let countdownValue = leadTimeSeconds;
        showCallCountdown(countdownValue);
        targetCountdownInterval = setInterval(() => {
            countdownValue--;
            if (countdownValue >= 1) showCallCountdown(countdownValue);
        }, 1000);

        targetRevealTimeout = setTimeout(revealTargetCall, leadTimeSeconds * 1000);
    }

    function renderTargetTable(formation, rows) {
        const container = document.getElementById('tgtPosit');
        const table = document.createElement('table');
        table.className = 'data-table target-table';

        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');
        ['Formation', 'Position', 'Bullseye', 'Altitude', 'Track'].forEach(label => {
            const th = document.createElement('th');
            th.textContent = label;
            headerRow.appendChild(th);
        });
        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        rows.forEach((row, index) => {
            const tr = document.createElement('tr');
            if (index === 0) {
                const formationCell = document.createElement('td');
                formationCell.className = 'formation-cell';
                formationCell.rowSpan = rows.length;
                formationCell.textContent = formation;
                tr.appendChild(formationCell);
            }
            const positionCell = document.createElement('td');
            const positionLabel = document.createElement('span');
            positionLabel.className = 'group-label';

                const badge = document.createElement('span');
                badge.className = 'group-number-badge';

                const td = document.createElement('td');
                td.textContent = value;
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
