<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bullseye Trainer</title>
    <style>
        /* Light & Dark 테마 색상 변수 정의 */
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-color: #2c3e50;
            --muted-color: #7f8c8d;
            --border-color: #bdc3c7;
            --input-bg: #ffffff;
            --canvas-border: #bdc3c7;
            --canvas-bg: #fdfdfd;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --dash-line-color: rgba(0, 0, 0, 0.4);
        }

        body.dark-mode {
            --bg-color: #2c3e50;
            --panel-bg: #34495e;
            --text-color: #ecf0f1;
            --muted-color: #bdc3c7;
            --border-color: #7f8c8d;
            --input-bg: #2c3e50;
            --canvas-border: #95a5a6;
            --canvas-bg: #ecf0f1;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --dash-line-color: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
            padding: 20px 10px;
            transition: background-color 0.3s, color 0.3s;
        }
        .app-container {
            display: flex;
            flex-direction: row;
            background-color: var(--panel-bg);
            padding: 30px;
            gap: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px var(--shadow-color);
            max-width: 100%;
            transition: background-color 0.3s, box-shadow 0.3s;
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            width: 280px;
            gap: 15px;
        }

        .title-container {
            text-align: center;
            margin-bottom: 5px;
        }
        .title-container h1 {
            margin: 0;
            font-size: 26px;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .title-container .subtitle {
            margin-top: 5px;
            font-size: 13px;
            color: var(--muted-color);
            font-style: italic;
            transition: color 0.3s;
        }

        .right-panel {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: var(--canvas-bg);
            border-radius: 50%;
            border: 2px solid var(--canvas-border);
            max-width: 100%;
            height: auto;
            cursor: crosshair;
            touch-action: none; /* 모바일 레이더 터치 시 스크롤 방지 추가 */
            transition: background-color 0.3s, border-color 0.3s;
        }
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
        }
        .plot-controls {
            display: flex;
            align-items: center;
            font-size: 14px;
        }
        #rateDisplay {
            font-size: 14px;
            color: var(--muted-color);
            transition: color 0.3s;
        }
        .theme-toggle {
            cursor: pointer;
            user-select: none;
            font-size: 18px;
            line-height: 1;
        }

        /* --- 커스텀 툴팁(말풍선) 디자인 --- */
        .help-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            background-color: var(--muted-color);
            color: var(--panel-bg);
            border-radius: 50%;
            text-align: center;
            line-height: 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: help;
            margin-left: 6px;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }
        .help-icon::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 150%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            width: 220px;
            font-size: 12px;
            font-weight: normal;
            line-height: 1.5;
            text-align: left;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .help-icon::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(0, 0, 0, 0.85) transparent transparent transparent;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s ease-in-out;
            pointer-events: none;
            z-index: 100;
        }
        .help-icon:hover::after,
        .help-icon:hover::before {
            opacity: 1;
            visibility: visible;
        }
        /* --------------------------------- */

        button {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            transition: background-color 0.2s;
            width: 100%;
            font-weight: bold;
            margin-top: 5px;
        }
        button:hover {
            background-color: #2980b9;
        }
        fieldset {
            border: 1px solid var(--border-color);
            padding: 15px;
            margin: 0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }
        legend {
            font-size: 14px;
            color: var(--muted-color);
            padding: 0 10px;
            transition: color 0.3s;
        }
        .posit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .posit-row:last-child {
            margin-bottom: 0;
        }
        .posit-value {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            width: 140px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            border-radius: 4px;
            transition: border-color 0.3s;
        }
        .blue-bg { background-color: #3498db; color: white; border-color: #2980b9; }
        .red-bg { background-color: #e74c3c; color: white; border-color: #c0392b; }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 15px;
        }
        .input-row input {
            width: 110px;
            padding: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }
        #resultBox {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            display: none;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.3);
            margin-top: 5px;
        }
        .correct { background-color: #2ecc71; color: white; }
        .incorrect { background-color: #e74c3c; color: white; }

        @media (max-width: 768px) {
            body {
                align-items: flex-start;
            }
            .app-container {
                flex-direction: column;
                padding: 20px;
                gap: 20px;
                width: 100%;
                max-width: 400px;
            }
            .left-panel {
                width: 100%;
            }
            canvas {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">

        <div class="title-container">
            <h1>BULLSEYE TRAINER</h1>
            <div class="subtitle">reproduced by Badger</div>
        </div>

        <div class="controls-group">
            <div class="top-controls">
                <div>
                    <label><input type="checkbox" id="easyMode"> Easy</label>
                    <label style="margin-left: 8px;"><input type="checkbox" id="voiceMode" checked> Voice</label>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label class="theme-toggle" title="Toggle Light/Dark Mode">
                        <input type="checkbox" id="themeToggle" style="display:none;">
                        <span id="themeIcon">🌙</span>
                    </label>
                    <span id="rateDisplay">Your Rate: 0/0</span>
                </div>
            </div>

            <div class="plot-controls">
                <label><input type="checkbox" id="plotMode"> Manual Plotting</label>
                <span class="help-icon" data-tooltip="레이더 화면에 예상 위치를 직접 마킹해 볼 수 있습니다. 첫 번째 클릭은 내 기체(파란색), 두 번째 클릭은 타겟(빨간색)으로 표시됩니다.">?</span>
            </div>
        </div>

        <button id="btnGenerate">GENERATE</button>

        <fieldset>
            <legend>Posit</legend>
            <div class="posit-row">
                <span>Your Posit:</span>
                <div class="posit-value blue-bg" id="myPosit">---° | -- nm</div>
            </div>
            <div class="posit-row">
                <span>Target Posit:</span>
                <div class="posit-value red-bg" id="tgtPosit">---° | -- nm</div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Input to target</legend>
            <div class="input-row">
                <span>Bearing [°]:</span>
                <input type="number" id="inputBearing" inputmode="numeric" pattern="[0-9]*">
            </div>
        </fieldset>

        <button id="btnCheck">CHECK</button>

        <div id="resultBox"></div>
    </div>

    <div class="right-panel">
        <canvas id="radarCanvas" width="400" height="400"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const MAX_RANGE = 150;
    const MIN_RANGE = 30;
    const CENTER = 200;
    const RADIUS = 180;
    const SCALE = RADIUS / MAX_RANGE;

    let myData = { brg: 0, rng: 0 };
    let tgtData = { brg: 0, rng: 0 };
    let isCorrect = false;
    let isChecked = false;
    let trueBearing = 0;

    let correctAnswers = 0;
    let totalAttempts = 0;
    let isCurrentProblemScored = false;

    let animationStartTime = 0;
    let isAnimating = false;
    const ANIMATION_DURATION = 300;

    let userMyPos = null;
    let userTgtPos = null;

    let myVoice = null;

    function initVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        const preferredNames = ['Alex', 'Fred', 'Microsoft David', 'Google US English'];

        for (let name of preferredNames) {
            const voice = voices.find(v => v.name.includes(name) && v.lang.includes('en-US'));
            if (voice) {
                myVoice = voice;
                return;
            }
        }

        if (!myVoice) {
            myVoice = voices.find(v => v.lang.includes('en-US') && v.name.toLowerCase().includes('male'));
        }

        if (!myVoice) {
            myVoice = voices.find(v => v.lang.includes('en-US'));
        }
    }

    if ('speechSynthesis' in window) {
        initVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }
    }

    document.getElementById('themeToggle').addEventListener('change', function() {
        if (this.checked) {
            document.body.classList.add('dark-mode');
            document.getElementById('themeIcon').innerText = '☀️';
        } else {
            document.body.classList.remove('dark-mode');
            document.getElementById('themeIcon').innerText = '🌙';
        }
        drawRadar();
    });

    document.getElementById('plotMode').addEventListener('change', function() {
        if (!this.checked) {
            userMyPos = null;
            userTgtPos = null;
            drawRadar();
        }
    });

    document.getElementById('btnGenerate').addEventListener('click', generatePosits);
    document.getElementById('btnCheck').addEventListener('click', checkAnswer);
    document.getElementById('easyMode').addEventListener('change', drawRadar);

    document.getElementById('voiceMode').addEventListener('change', function() {
        updateTargetPositUI();
    });

    document.getElementById('inputBearing').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            this.blur();
            checkAnswer();
        }
    });

    canvas.addEventListener('pointerdown', function(event) {
        const plotMode = document.getElementById('plotMode').checked;
        if (!plotMode) return;

        const easyMode = document.getElementById('easyMode').checked;
        if (easyMode || isChecked) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = (event.clientX - rect.left) * scaleX;
        const y = (event.clientY - rect.top) * scaleY;

        if (!userMyPos) {
            userMyPos = {x, y};
        } else if (!userTgtPos) {
            userTgtPos = {x, y};
        } else {
            userMyPos = {x, y};
            userTgtPos = null;
        }
        drawRadar();
    });

    function init() {
        drawRadar();
    }

    function generatePosits() {
        isAnimating = false;
        isCorrect = false;
        isChecked = false;
        isCurrentProblemScored = false;

        userMyPos = null;
        userTgtPos = null;

        myData.brg = Math.floor(Math.random() * 361);
        myData.rng = Math.floor(Math.random() * (MAX_RANGE - MIN_RANGE + 1)) + MIN_RANGE;

        tgtData.brg = Math.floor(Math.random() * 361);
        tgtData.rng = Math.floor(Math.random() * (MAX_RANGE - MIN_RANGE + 1)) + MIN_RANGE;

        document.getElementById('myPosit').innerText = `${myData.brg}° | ${myData.rng} nm`;

        updateTargetPositUI();

        if (document.getElementById('voiceMode').checked) {
            speakTargetPosit(tgtData.brg, tgtData.rng);
        }

        const inputField = document.getElementById('inputBearing');
        inputField.value = '';
        inputField.focus();

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';

        calculateTrueBearing();
        drawRadar();
    }

    function updateTargetPositUI() {
        if (tgtData.rng === 0 && tgtData.brg === 0) return;

        const isVoice = document.getElementById('voiceMode').checked;
        if (isVoice && !isChecked) {
            document.getElementById('tgtPosit').innerText = `---° | -- nm`;
        } else {
            document.getElementById('tgtPosit').innerText = `${tgtData.brg}° | ${tgtData.rng} nm`;
        }
    }

    function formatBearingForSpeech(brg) {
        return brg.toString().padStart(3, '0').split('').join(' ');
    }

    function speakTargetPosit(brg, rng) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();

            const spokenBearing = formatBearingForSpeech(brg);
            const textToSpeak = `Bullseye ${spokenBearing}, ${rng} miles.`;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;

            if (myVoice) {
                utterance.voice = myVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    }

    function calculateTrueBearing() {
        const myRad = myData.brg * (Math.PI / 180);
        const myX = myData.rng * Math.sin(myRad);
        const myY = -myData.rng * Math.cos(myRad);

        const tgtRad = tgtData.brg * (Math.PI / 180);
        const tgtX = tgtData.rng * Math.sin(tgtRad);
        const tgtY = -tgtData.rng * Math.cos(tgtRad);

        const dx = tgtX - myX;
        const dy = tgtY - myY;

        let angleRad = Math.atan2(dx, -dy);
        let angleDeg = angleRad * (180 / Math.PI);

        if (angleDeg < 0) angleDeg += 360;
        trueBearing = Math.round(angleDeg);
    }

    function checkAnswer() {
        if (isAnimating) return;

        const inputVal = parseInt(document.getElementById('inputBearing').value, 10);
        if (isNaN(inputVal)) {
            alert("Bearing 값을 입력해주세요.");
            return;
        }

        isChecked = true;

        let diff = Math.abs(inputVal - trueBearing) % 360;
        let finalDiff = diff > 180 ? 360 - diff : diff;

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        document.getElementById('tgtPosit').innerText = `${tgtData.brg}° | ${tgtData.rng} nm`;

        if (finalDiff <= 20) {
            isCorrect = true;
            resultBox.innerText = `Good! ${trueBearing}° (±20°)`;
            resultBox.className = 'correct';

            if (!isCurrentProblemScored) {
                correctAnswers++;
                totalAttempts++;
                isCurrentProblemScored = true;
            }
        } else {
            isCorrect = false;
            resultBox.innerText = `Incorrect! True Bearing: ${trueBearing}°`;
            resultBox.className = 'incorrect';

            if (!isCurrentProblemScored) {
                totalAttempts++;
                isCurrentProblemScored = true;
            }
        }

        document.getElementById('rateDisplay').innerText = `Your Rate: ${correctAnswers}/${totalAttempts}`;

        startAnimateRadar();
    }

    function startAnimateRadar() {
        isAnimating = true;
        animationStartTime = performance.now();
        requestAnimationFrame(animateLoop);
    }

    function animateLoop(currentTime) {
        if (!isAnimating) return;

        const elapsedTime = currentTime - animationStartTime;
        let progress = elapsedTime / ANIMATION_DURATION;

        if (progress > 1) progress = 1;

        drawRadar(progress);

        if (progress < 1) {
            requestAnimationFrame(animateLoop);
        } else {
            isAnimating = false;
        }
    }

    function drawBullseyeMarker(x, y) {
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 1;
        for (let r = 5; r <= 15; r += 5) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, 2 * Math.PI);
            ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(x - 20, y);
        ctx.lineTo(x + 20, y);
        ctx.moveTo(x, y - 20);
        ctx.lineTo(x, y + 20);
        ctx.stroke();
    }

    function lerp(start, end, amt) {
        return start + (end - start) * amt;
    }

    function drawRadar(progress = 1) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(CENTER, CENTER, RADIUS, 0, 2 * Math.PI);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(CENTER, CENTER - RADIUS);
        ctx.lineTo(CENTER, CENTER + RADIUS);
        ctx.moveTo(CENTER - RADIUS, CENTER);
        ctx.lineTo(CENTER + RADIUS, CENTER);
        ctx.stroke();

        drawBullseyeMarker(CENTER, CENTER);

        ctx.font = "14px Arial";
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        ctx.fillText("N", CENTER, CENTER - RADIUS - 5);
        ctx.fillText("S", CENTER, CENTER + RADIUS + 15);
        ctx.textAlign = "left";
        ctx.fillText("E", CENTER + RADIUS + 5, CENTER + 5);
        ctx.textAlign = "right";
        ctx.fillText("W", CENTER - RADIUS - 5, CENTER + 5);

        const easyMode = document.getElementById('easyMode').checked;

        const myRad = myData.brg * (Math.PI / 180);
        const myX = CENTER + (myData.rng * Math.sin(myRad) * SCALE);
        const myY = CENTER - (myData.rng * Math.cos(myRad) * SCALE);

        const tgtRad = tgtData.brg * (Math.PI / 180);
        const tgtX = CENTER + (tgtData.rng * Math.sin(tgtRad) * SCALE);
        const tgtY = CENTER - (tgtData.rng * Math.cos(tgtRad) * SCALE);

        if (!easyMode && !isChecked) {
            if (userMyPos) {
                ctx.beginPath();
                ctx.arc(userMyPos.x, userMyPos.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#3498db';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            if (userTgtPos) {
                ctx.beginPath();
                ctx.arc(userTgtPos.x, userTgtPos.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(userMyPos.x, userMyPos.y);
                ctx.lineTo(userTgtPos.x, userTgtPos.y);
                ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--dash-line-color').trim();
                ctx.setLineDash([5, 5]);
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        if (isChecked && userMyPos) {
            ctx.beginPath();
            ctx.arc(userMyPos.x, userMyPos.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(52, 152, 219, 0.4)';
            ctx.fill();
        }
        if (isChecked && userTgtPos) {
            ctx.beginPath();
            ctx.arc(userTgtPos.x, userTgtPos.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';
            ctx.fill();
        }

        if (easyMode || isChecked) {
            ctx.beginPath();
            ctx.arc(myX, myY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#3498db';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(tgtX, tgtY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#e74c3c';
            ctx.fill();
        }

        if (isChecked) {
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(myX, myY);

            if (progress <= 0.5) {
                const p1 = progress * 2;
                ctx.lineTo(lerp(myX, CENTER, p1), lerp(myY, CENTER, p1));
            } else {
                ctx.lineTo(CENTER, CENTER);
                const p2 = (progress - 0.5) * 2;
                ctx.lineTo(lerp(CENTER, tgtX, p2), lerp(CENTER, tgtY, p2));
            }
            ctx.stroke();

            ctx.strokeStyle = '#2ecc71';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(myX, myY);
            ctx.lineTo(lerp(myX, tgtX, progress), lerp(myY, tgtY, progress));
            ctx.stroke();
        }
    }

    init();
</script>

</body>
</html>
