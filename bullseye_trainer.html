<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bullseye Training</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #000;
        }
        .app-container {
            display: flex;
            background-color: #f0f0f0;
            padding: 20px;
            gap: 20px;
        }
        .left-panel {
            display: flex;
            flex-direction: column;
            width: 250px;
            gap: 15px;
        }
        .right-panel {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #f0f0f0;
            border-radius: 50%;
        }
        .description {
            font-size: 12px;
            line-height: 1.4;
            color: #333;
        }
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        #rateDisplay {
            font-size: 13px;
            color: #333;
        }
        button {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: 2px solid #a0a0a0;
            background-color: #e0e0e0;
            border-radius: 2px;
        }
        button:hover {
            background-color: #d0d0d0;
        }
        fieldset {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 0;
        }
        legend {
            font-size: 12px;
            color: #333;
        }
        .posit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .posit-row:last-child {
            margin-bottom: 0;
        }
        .posit-value {
            padding: 4px 8px;
            border: 1px solid #999;
            width: 120px;
            text-align: center;
            font-family: monospace;
            font-size: 14px;
        }
        .blue-bg { background-color: #4da6ff; color: white; border-color: #0066cc; }
        .red-bg { background-color: #ff6666; color: white; border-color: #cc0000; }

        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .input-row input {
            width: 100px;
            padding: 4px;
            border: 1px solid #999;
            font-family: monospace;
            font-size: 14px;
        }
        #resultBox {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
            border: 1px solid #000;
        }
        .correct { background-color: #009900; color: white; }
        .incorrect { background-color: #cc0000; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">
        <div class="description">
            Description:<br>
            This tool generates two coordinates. Enter your estimate bearing to the target. This tool will check your answer.
        </div>

        <div class="top-controls">
            <div>
                <label><input type="checkbox" id="easyMode" checked> easy</label>
                <label style="margin-left: 8px;"><input type="checkbox" id="voiceMode"> voice</label>
            </div>
            <span id="rateDisplay">Your Rate: 0/0</span>
        </div>

        <button id="btnGenerate">GENERATE</button>

        <fieldset>
            <legend>Posit</legend>
            <div class="posit-row">
                <span>Your Posit:</span>
                <div class="posit-value blue-bg" id="myPosit">---° | -- nm</div>
            </div>
            <div class="posit-row">
                <span>Target Posit:</span>
                <div class="posit-value red-bg" id="tgtPosit">---° | -- nm</div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Input to target</legend>
            <div class="input-row">
                <span>Bearing [°]:</span>
                <input type="number" id="inputBearing">
            </div>
        </fieldset>

        <button id="btnCheck">CHECK</button>

        <div id="resultBox"></div>
    </div>

    <div class="right-panel">
        <canvas id="radarCanvas" width="400" height="400"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const MAX_RANGE = 150;
    const CENTER = 200;
    const RADIUS = 180;
    const SCALE = RADIUS / MAX_RANGE;

    let myData = { brg: 0, rng: 0 };
    let tgtData = { brg: 0, rng: 0 };
    let isCorrect = false;
    let trueBearing = 0;

    let correctAnswers = 0;
    let totalAttempts = 0;
    let isCurrentProblemScored = false;

    // --- 목소리 고정 로직 ---
    let myVoice = null; // 선택된 목소리를 담아둘 전역 변수

    function initVoices() {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return;

        // 미국 영어 남성 목소리 우선순위 (Alex와 Fred 등)
        const preferredNames = ['Alex', 'Fred', 'Microsoft David', 'Google US English'];

        for (let name of preferredNames) {
            const voice = voices.find(v => v.name.includes(name) && v.lang.includes('en-US'));
            if (voice) {
                myVoice = voice;
                return;
            }
        }

        // 차선책: 이름에 male이 들어간 en-US 목소리
        if (!myVoice) {
            myVoice = voices.find(v => v.lang.includes('en-US') && v.name.toLowerCase().includes('male'));
        }

        // 최후의 수단: 그냥 en-US 목소리 중 첫 번째
        if (!myVoice) {
            myVoice = voices.find(v => v.lang.includes('en-US'));
        }
    }

    if ('speechSynthesis' in window) {
        initVoices(); // 초기 로드 시 시도
        // 브라우저가 목소리 목록을 비동기로 가져올 때 다시 시도
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = initVoices;
        }
    }
    // -------------------------

    document.getElementById('btnGenerate').addEventListener('click', generatePosits);
    document.getElementById('btnCheck').addEventListener('click', checkAnswer);
    document.getElementById('easyMode').addEventListener('change', drawRadar);

    document.getElementById('voiceMode').addEventListener('change', function() {
        updateTargetPositUI();
    });

    document.getElementById('inputBearing').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            checkAnswer();
        }
    });

    function init() {
        drawRadar();
    }

    function generatePosits() {
        myData.brg = Math.floor(Math.random() * 361);
        myData.rng = Math.floor(Math.random() * (MAX_RANGE + 1));

        tgtData.brg = Math.floor(Math.random() * 361);
        tgtData.rng = Math.floor(Math.random() * (MAX_RANGE + 1));

        document.getElementById('myPosit').innerText = `${myData.brg}° | ${myData.rng} nm`;

        updateTargetPositUI();

        if (document.getElementById('voiceMode').checked) {
            speakTargetPosit(tgtData.brg, tgtData.rng);
        }

        const inputField = document.getElementById('inputBearing');
        inputField.value = '';
        inputField.focus();

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'none';

        isCorrect = false;
        isCurrentProblemScored = false;

        calculateTrueBearing();
        drawRadar();
    }

    function updateTargetPositUI() {
        if (tgtData.rng === 0 && tgtData.brg === 0) return;

        const isVoice = document.getElementById('voiceMode').checked;
        if (isVoice) {
            document.getElementById('tgtPosit').innerText = `---° | -- nm`;
        } else {
            document.getElementById('tgtPosit').innerText = `${tgtData.brg}° | ${tgtData.rng} nm`;
        }
    }

    function formatBearingForSpeech(brg) {
        return brg.toString().padStart(3, '0').split('').join(' ');
    }

    function speakTargetPosit(brg, rng) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();

            const spokenBearing = formatBearingForSpeech(brg);
            const textToSpeak = `Bullseye ${spokenBearing}, ${rng} miles.`;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;

            // 고정해둔 목소리를 매번 명시적으로 할당
            if (myVoice) {
                utterance.voice = myVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    }

    function calculateTrueBearing() {
        const myRad = myData.brg * (Math.PI / 180);
        const myX = myData.rng * Math.sin(myRad);
        const myY = -myData.rng * Math.cos(myRad);

        const tgtRad = tgtData.brg * (Math.PI / 180);
        const tgtX = tgtData.rng * Math.sin(tgtRad);
        const tgtY = -tgtData.rng * Math.cos(tgtRad);

        const dx = tgtX - myX;
        const dy = tgtY - myY;

        let angleRad = Math.atan2(dx, -dy);
        let angleDeg = angleRad * (180 / Math.PI);

        if (angleDeg < 0) angleDeg += 360;
        trueBearing = Math.round(angleDeg);
    }

    function checkAnswer() {
        const inputVal = parseInt(document.getElementById('inputBearing').value, 10);
        if (isNaN(inputVal)) {
            alert("Bearing 값을 입력해주세요.");
            return;
        }

        let diff = Math.abs(inputVal - trueBearing) % 360;
        let finalDiff = diff > 180 ? 360 - diff : diff;

        const resultBox = document.getElementById('resultBox');
        resultBox.style.display = 'block';

        if (finalDiff <= 20) {
            isCorrect = true;
            resultBox.innerText = `Good! ${trueBearing}° (±20°)`;
            resultBox.className = 'correct';

            document.getElementById('tgtPosit').innerText = `${tgtData.brg}° | ${tgtData.rng} nm`;

            if (!isCurrentProblemScored) {
                correctAnswers++;
                totalAttempts++;
                isCurrentProblemScored = true;
            }
        } else {
            isCorrect = false;
            resultBox.innerText = `Incorrect! True Bearing: ${trueBearing}°`;
            resultBox.className = 'incorrect';

            if (!isCurrentProblemScored) {
                totalAttempts++;
                isCurrentProblemScored = true;
            }
        }

        document.getElementById('rateDisplay').innerText = `Your Rate: ${correctAnswers}/${totalAttempts}`;
        drawRadar();
    }

    function drawRadar() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.arc(CENTER, CENTER, RADIUS, 0, 2 * Math.PI);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(CENTER, CENTER - RADIUS);
        ctx.lineTo(CENTER, CENTER + RADIUS);
        ctx.moveTo(CENTER - RADIUS, CENTER);
        ctx.lineTo(CENTER + RADIUS, CENTER);
        ctx.stroke();

        ctx.font = "14px Arial";
        ctx.fillStyle = "#000";
        ctx.textAlign = "center";
        ctx.fillText("N", CENTER, CENTER - RADIUS - 5);
        ctx.fillText("S", CENTER, CENTER + RADIUS + 15);
        ctx.textAlign = "left";
        ctx.fillText("E", CENTER + RADIUS + 5, CENTER + 5);
        ctx.textAlign = "right";
        ctx.fillText("W", CENTER - RADIUS - 5, CENTER + 5);

        const easyMode = document.getElementById('easyMode').checked;

        if (easyMode || isCorrect) {
            const myRad = myData.brg * (Math.PI / 180);
            const myX = CENTER + (myData.rng * Math.sin(myRad) * SCALE);
            const myY = CENTER - (myData.rng * Math.cos(myRad) * SCALE);

            const tgtRad = tgtData.brg * (Math.PI / 180);
            const tgtX = CENTER + (tgtData.rng * Math.sin(tgtRad) * SCALE);
            const tgtY = CENTER - (tgtData.rng * Math.cos(tgtRad) * SCALE);

            if (isCorrect) {
                ctx.beginPath();
                ctx.moveTo(myX, myY);
                ctx.lineTo(CENTER, CENTER);
                ctx.lineTo(tgtX, tgtY);
                ctx.strokeStyle = '#ff0000';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(myX, myY);
                ctx.lineTo(tgtX, tgtY);
                ctx.strokeStyle = '#00cc00';
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            ctx.beginPath();
            ctx.arc(myX, myY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#4da6ff';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(tgtX, tgtY, 4, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff6666';
            ctx.fill();
        }
    }

    init();
</script>

</body>
</html>
