<!DOCTYPE html>
<!-- 브라우저가 제공하는 음성 목록(name·voiceURI·lang)을 보여 주고 들어 보는 진단 페이지 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Voice Check</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            padding: 12px;
            font: 14px/1.4 -apple-system, 'Segoe UI', Arial, sans-serif;
            background: Canvas;
            color: CanvasText;
        }
        h1 { margin: 0 0 4px; font-size: 18px; }
        p { margin: 0 0 10px; color: GrayText; }
        label { display: inline-flex; gap: 4px; align-items: center; margin-bottom: 10px; }
        ul { margin: 0; padding: 0; list-style: none; }
        li {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
        }
        .info { flex: 1; min-width: 0; overflow-wrap: anywhere; }
        .name { font-weight: bold; }
        .meta { font: 12px/1.35 ui-monospace, Menlo, monospace; color: GrayText; }
        button { flex: 0 0 auto; padding: 6px 10px; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Voice Check</h1>
    <p>All voices this browser exposes to the trainer. Tap Play to hear one.</p>
    <label><input type="checkbox" id="englishOnly" checked> English only</label>
    <ul id="voiceList"><li>Loading…</li></ul>

    <script>
        const SAMPLE = 'Lead group, bullseye zero niner zero, forty five, at fifteen thousand.';

        function render() {
            const englishOnly = document.getElementById('englishOnly').checked;
            const voices = speechSynthesis.getVoices()
                .filter(voice => !englishOnly || voice.lang.toLowerCase().startsWith('en'));
            const list = document.getElementById('voiceList');
            list.replaceChildren();
            if (voices.length === 0) {
                list.innerHTML = '<li>No voices reported yet.</li>';
                return;
            }
            voices.forEach(voice => {
                const item = document.createElement('li');
                const info = document.createElement('div');
                info.className = 'info';
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = voice.name;
                const meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = `${voice.voiceURI} · ${voice.lang}` +
                    `${voice.localService ? ' · local' : ' · network'}${voice.default ? ' · default' : ''}`;
                info.append(name, meta);
                const play = document.createElement('button');
                play.type = 'button';
                play.textContent = 'Play';
                play.addEventListener('click', () => {
                    speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(SAMPLE);
                    utterance.voice = voice;
                    utterance.lang = voice.lang;
                    speechSynthesis.speak(utterance);
                });
                item.append(info, play);
                list.appendChild(item);
            });
        }

        document.getElementById('englishOnly').addEventListener('change', render);
        speechSynthesis.addEventListener('voiceschanged', render);
        render();
        setTimeout(render, 1000);
    </script>
</body>
</html>
